<style>
:root{--void:#0b0c10;--panel:#121319;--panel2:#171920;--panel3:#1e2029;--line:rgba(255,255,255,.065);--line2:rgba(255,255,255,.11);
--ink:#eceef2;--dim:#99a0ab;--faint:#5d636e;--ok:#3ccf82;--warn:#f2b03d;--bad:#f2596a;--info:#3fc8e4;
--accent:#ec1c32;--acc-rgb:236,28,50;--accent-soft:rgba(var(--acc-rgb),.12);--accent-glow:rgba(var(--acc-rgb),.16);--cy:#19c3e0;
--r:14px;--r-sm:10px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
html[data-theme="light"]{--void:#f3f4f7;--panel:#fff;--panel2:#f6f7f9;--panel3:#eceef2;--line:rgba(16,22,34,.08);--line2:rgba(16,22,34,.14);
--ink:#161a22;--dim:#5b6270;--faint:#959ba6;--ok:#17925a;--warn:#b4760f;--bad:#d3374a;--info:#0e8fa6;--accent:#d3142a;--shadow:0 10px 30px rgba(16,22,34,.1);color-scheme:light}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--void);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.55;touch-action:manipulation;overflow-x:hidden;
 background-image:radial-gradient(ellipse 700px 380px at 50% -80px,var(--accent-glow),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:0;background:none}
button:active,.tapz:active{transform:scale(.97)}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r-sm);padding:11px 13px;font-size:16px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:92px;resize:vertical}
label{display:block;font-size:13px;color:var(--dim);margin:12px 0 5px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:"JetBrains Mono",monospace;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.wm{font-family:Audiowide,sans-serif;direction:ltr;unicode-bidi:isolate;letter-spacing:2px}
.wm em{font-style:normal;color:var(--accent)}
h1{font-family:Cairo,sans-serif;font-weight:800;font-size:26px;line-height:1.3}
.eye{font-family:Audiowide,sans-serif;font-size:11px;letter-spacing:2px;color:var(--accent);direction:ltr;text-align:right;margin-bottom:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;position:relative;min-width:0}
.card.br::before,.card.br::after{content:"";position:absolute;width:12px;height:12px;border:1.5px solid var(--accent);opacity:.55}
.card.br::before{top:-1px;right:-1px;border-left:0;border-bottom:0;border-top-right-radius:var(--r)}
.card.br::after{bottom:-1px;left:-1px;border-right:0;border-top:0;border-bottom-left-radius:var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:var(--r-sm);font-weight:700;font-size:15px;min-height:44px;white-space:nowrap}
.btn.pri{background:var(--accent);color:#fff}
.btn.gh{background:var(--panel2);border:1px solid var(--line2)}
.btn.tint{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:7px 12px;min-height:38px;font-size:13.5px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:999px;white-space:nowrap}
.p-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}.p-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.p-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}.p-info{color:var(--info);background:color-mix(in srgb,var(--info) 15%,transparent)}
.p-mute{color:var(--dim);background:var(--panel3)}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.grow{flex:1;min-width:0}
.muted{color:var(--dim)}.small{font-size:13px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid var(--line2);background:var(--panel2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);font-size:13.5px;font-weight:700;color:var(--dim)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.stats{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat .v{font-size:30px;font-weight:700;line-height:1.2}.stat .l{font-size:13px;color:var(--dim)}
.sw{position:relative;width:46px;height:27px;border-radius:99px;background:var(--panel3);border:1px solid var(--line2);flex:none}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.18s}
.sw.on{background:var(--accent);border-color:var(--accent)}.sw.on::after{right:21px}
[hidden]{display:none!important}
#toast{position:fixed;top:calc(12px + var(--sat));left:50%;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--void);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;max-width:calc(100vw - 32px);box-shadow:var(--shadow);text-align:center}
/* gate */
#gate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--void);background-image:radial-gradient(ellipse 600px 420px at 50% 30%,var(--accent-glow),transparent 70%)}
.gbox{width:min(380px,100%);text-align:center}
.core{position:relative;width:150px;height:150px;margin:0 auto 14px}
.core svg{position:absolute;inset:22px;width:106px;height:106px}
.core i{position:absolute;inset:0;border-radius:50%}
.core .r1{border:1.5px dashed var(--line2);animation:sp 16s linear infinite}
.core .r2{inset:9px;border:2px solid transparent;border-top-color:var(--accent);border-left-color:var(--accent);animation:sp 3.2s linear infinite reverse}
.core .gl{inset:30px;background:radial-gradient(var(--accent-glow),transparent 70%);animation:pu 2.4s ease-in-out infinite}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pu{50%{transform:scale(1.25);opacity:.6}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.shake{animation:shake .4s}.shake input{border-color:var(--bad)}
.bar{height:3px;border-radius:3px;background:var(--panel3);overflow:hidden;margin-top:12px}.bar b{display:block;height:100%;width:40%;background:var(--accent);animation:ld 1s ease-in-out infinite}
@keyframes ld{from{margin-right:-40%}to{margin-right:100%}}
.credit{font-size:12.5px;color:var(--faint);margin-top:18px}.credit b{color:var(--dim)}
/* app shell */
#app{display:flex;min-height:100vh}
#side{width:250px;flex:none;position:sticky;top:0;height:100vh;padding:20px 16px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:6px}
#side .logo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
#side .logo svg{width:44px;height:44px}
.nav{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--r-sm);color:var(--dim);font-weight:700;width:100%;text-align:right}
.nav .n{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--faint)}
.nav.on{background:var(--accent-soft);color:var(--accent)}.nav.on .n{color:var(--accent)}
.nav .bdg,.bbdg{margin-inline-start:auto;background:var(--accent);color:#fff;border-radius:99px;font-size:11.5px;min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
#main{flex:1;min-width:0;padding:26px 26px 60px;max-width:1240px;margin:0 auto;width:100%}
#top{display:none}
#bnav{display:none}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pg>*{animation:in .32s both}.pg>*:nth-child(2){animation-delay:.05s}.pg>*:nth-child(3){animation-delay:.1s}.pg>*:nth-child(4){animation-delay:.15s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.empty{text-align:center;color:var(--dim);padding:34px 10px}
.stripe{position:absolute;top:10px;bottom:10px;right:0;width:4px;border-radius:4px}
.url{font-family:"JetBrains Mono",monospace;font-size:12.5px;direction:ltr;text-align:left;background:var(--panel2);border:1px dashed var(--line2);border-radius:8px;padding:8px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatches{display:flex;gap:10px;flex-wrap:wrap}.swc{width:38px;height:38px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line2)}.swc.on{border-color:var(--ink)}
/* sheet */
#sw{position:fixed;inset:0;z-index:70;background:rgba(5,6,10,.55);display:flex;align-items:center;justify-content:center;padding:20px}
#sheet{background:var(--panel);border:1px solid var(--line2);border-radius:18px;width:min(540px,100%);max-height:min(88vh,860px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:in .25s both}
#sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
#sheet header b{font-family:Cairo,sans-serif;font-weight:800;font-size:20px}
#sbody{padding:4px 18px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#sfoot{padding:12px 18px calc(14px + var(--sab));border-top:1px solid var(--line);display:flex;gap:10px}
#sfoot:empty{display:none}
.xbtn{width:38px;height:38px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}.kv span:first-child{color:var(--dim);flex:none}
.kv span:last-child{text-align:left;min-width:0;overflow-wrap:anywhere}
.ck{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--r-sm);margin-top:8px;background:var(--panel2)}
.ck input{width:20px;height:20px;accent-color:var(--accent);flex:none}
@media (max-width:900px){
 #side{display:none}
 #main{padding:14px 14px calc(104px + var(--sab))}
 #top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;padding:calc(10px + var(--sat)) 14px 10px;background:color-mix(in srgb,var(--void) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
 #top svg.lg{width:36px;height:36px}
 #bnav{display:grid;grid-template-columns:repeat(2,1fr) 74px repeat(2,1fr);align-items:end;position:fixed;bottom:0;left:0;right:0;z-index:40;padding:8px 8px calc(8px + var(--sab));background:var(--panel);border-top:1px solid var(--line2)}
 #bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--dim);min-width:0;position:relative;padding:4px 0}
 #bnav button.on{color:var(--accent)}
 #bnav .bl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 #bnav .mid{justify-self:center}
 #bnav .mid span.d{width:54px;height:54px;border-radius:14px;transform:rotate(45deg);background:var(--accent);display:flex;align-items:center;justify-content:center;margin-top:-34px;box-shadow:0 8px 22px rgba(var(--acc-rgb),.45);border:4px solid var(--panel)}
 #bnav .mid span.d svg{transform:rotate(-45deg);color:#fff;width:24px;height:24px}
 #bnav .mid .bl{margin-top:6px}
 #bnav .bbdg{position:absolute;top:-2px;left:calc(50% - 22px)}
 h1{font-size:22px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 #sw{align-items:flex-end;padding:0}
 #sheet{width:100%;border-radius:20px 20px 0 0;max-height:90vh;animation:up .28s both}
 #sheet::before{content:"";width:44px;height:5px;border-radius:5px;background:var(--line2);margin:8px auto 0}
 @keyframes up{from{transform:translateY(100%)}}
}
/* ============ public page ============ */
#pub{max-width:760px;margin:0 auto;padding:calc(18px + var(--sat)) 16px calc(40px + var(--sab))}
.ptop{display:flex;align-items:center;gap:12px;justify-content:center;margin:6px 0 4px}
.ptop svg{width:64px;height:64px}
.ptop .wm{font-size:26px;line-height:1.1}.ptop small{display:block;font-family:Audiowide,sans-serif;font-size:9.5px;letter-spacing:4px;color:var(--accent);direction:ltr}
.phero{text-align:center;margin:18px 0 22px}
.phero h1{font-size:30px;font-weight:900}.phero p{color:var(--dim);margin-top:6px}
.pc{padding:0;overflow:hidden;margin-bottom:14px}
.pc .hd{padding:16px 16px 12px;display:flex;gap:12px;align-items:flex-start}
.pc .no{font-family:Audiowide,sans-serif;font-size:22px;line-height:1.2;flex:none;direction:ltr}
.pc h2{font-family:Cairo,sans-serif;font-weight:800;font-size:21px;line-height:1.3}
.pc .en{font-family:Audiowide,sans-serif;font-size:10.5px;letter-spacing:3px;direction:ltr;text-align:right}
.pc .det{padding:0 16px 4px}
.pc ul{list-style:none;margin:10px 0 4px}
.pc li{display:flex;gap:9px;align-items:flex-start;padding:5px 0}.pc li svg{margin-top:3px;width:17px;height:17px}
.pc .ft{display:flex;gap:10px;padding:12px 16px 16px;flex-wrap:wrap}
.pc .ft .btn{flex:1 1 140px}
.price{display:inline-block;margin-top:8px;font-weight:700;padding:5px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2)}
.cta2{text-align:center;padding:22px 16px;border:1.5px dashed var(--line2);background:transparent;box-shadow:none}
.pfoot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pfoot .btn{flex:1 1 150px}
.okbox{text-align:center;padding:10px 0 4px}.okbox .ring{width:84px;height:84px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);border:3px solid var(--ok)}
.okbox .ring svg{width:42px;height:42px;stroke-width:2.6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  (LINKS.length?`<div class="grid">${LINKS.map(l=>{const oc=ORDERS.filter(o=>o.link===l.id).length,np=(l.prods||[]).length;return `<div class="card ${l.on!==false?"br":""}"><div class="row"><b class="grow" style="font-size:17px;overflow-wrap:anywhere">${esc(l.name||"رابط")}</b><button class="sw ${l.on!==false?"on":""}" data-a="linkon" data-id="${l.id}" aria-label="تشغيل"></button></div><div class="row small muted" style="margin:6px 0 8px;gap:14px;flex-wrap:wrap"><span>${ic("eye")} <span class="num">${fmt(l.views||0)}</span> زيارة</span><span>${ic("inbox")} <span class="num">${oc}</span> طلب</span><span>${np?np+" مواقع":"كل المواقع"}</span></div><div class="url">${esc(linkUrl(l.id))}</div><div class="row" style="margin-top:10px;flex-wrap:wrap;gap:8px"><button class="btn pri sm grow" data-a="copy" data-id="${l.id}">${ic("copy")}نسخ</button><a class="btn gh sm" href="${esc(linkUrl(l.id))}" target="_blank" rel="noopener" aria-label="افتح">${ic("ext")}</a><button class="btn gh sm" data-a="linkform" data-id="${l.id}" aria-label="تعديل">${ic("edit")}</button><button class="btn gh sm" data-a="linkdel" data-id="${l.id}" aria-label="حذف">${ic("trash")}</button></div></div>`}).join("")}</div>`:`<div class="card empty">ماكو روابط. دوس "رابط جديد".</div>`)}
function rSites(){const ps=prods();return head("04 · SITES","المواقع",`<button class="btn pri" data-a="siteform">${ic("plus")}موقع جديد</button>`)+
  `<p class="muted small" style="margin:-6px 0 12px">هذني المواقع اللي تطلع بصفحة الرابط ويه شرحها.</p>`+
  (ps.length?`<div class="grid">${ps.map((p,i)=>`<div class="card" style="padding-right:22px"><span class="stripe" style="background:${esc(p.color||"#ec1c32")}"></span><div class="row"><div class="grow"><div class="wm small" style="color:${esc(p.color||"#ec1c32")};letter-spacing:2px">${esc(p.en||"")}</div><b style="font-size:17px">${esc(p.name)}</b></div><button class="sw ${p.on!==false?"on":""}" data-a="siteon" data-id="${p.id}" aria-label="إظهار"></button></div><div class="muted small clamp" style="margin:6px 0 10px">${esc(p.tag||"")}</div><div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn tint sm grow" data-a="siteform" data-id="${p.id}">${ic("edit")}تعديل</button><button class="btn gh sm" data-a="sitemv" data-id="${p.id}" data-d="-1" aria-label="فوگ" ${i?"":"disabled"}>${ic("up")}</button><button class="btn gh sm" data-a="sitemv" data-id="${p.id}" data-d="1" aria-label="جوه" ${i<ps.length-1?"":"disabled"}>${ic("down")}</button><button class="btn gh sm" data-a="sitedel" data-id="${p.id}" aria-label="حذف">${ic("trash")}</button></div></div>`).join("")}</div>`:`<div class="card empty">ماكو مواقع. دوس "موقع جديد".</div>`)}
function rSet(){const c=CAT.company||{},m=localStorage.getItem("amhub_mode")||"light";
  return head("05 · SETTINGS","الإعدادات")+`<div class="grid"><div class="card br"><b>بيانات الشركة</b><div class="muted small">تظهر بصفحة الرابط</div>
  <label for="c_ar">الاسم بالعربي</label><input id="c_ar" value="${esc(c.ar||"")}"><label for="c_en">الاسم بالإنجليزي</label><input id="c_en" value="${esc(c.en||"")}" dir="ltr">
  <label for="c_tag">الجملة التعريفية</label><input id="c_tag" value="${esc(c.tagline||"")}"><label for="c_ph">رقم الهاتف (واتساب)</label><input id="c_ph" value="${esc(c.phone||"")}" inputmode="tel" dir="ltr">
  <label for="c_ig">حساب الانستا</label><input id="c_ig" value="${esc(c.insta||"")}" dir="ltr"><label for="c_ab">نبذة (اختياري)</label><textarea id="c_ab">${esc(c.about||"")}</textarea>
  <button class="btn pri wide" style="margin-top:12px" data-a="savecompany">حفظ</button></div>
  <div><div class="card"><b>أنواع الطلب</b><div class="muted small">كل سطر نوع يختاره العميل</div><textarea id="c_types" style="margin-top:8px;min-height:130px">${esc((CAT.types||[]).join("\n"))}</textarea><button class="btn tint wide" style="margin-top:10px" data-a="savetypes">حفظ الأنواع</button></div>
  <div class="card" style="margin-top:12px"><b>المظهر</b><div class="chips" style="margin-top:10px">${[["light","فاتح"],["dark","غامق"],["auto","تلقائي"]].map(x=>`<button class="chip ${m===x[0]?"on":""}" data-a="setmode" data-m="${x[0]}">${x[1]}</button>`).join("")}</div>
  <div class="row" style="margin-top:14px"><span class="grow">صوت عند وصول طلب</span><button class="sw ${SOUND?"on":""}" data-a="snd" aria-label="الصوت"></button></div></div>
  <button class="btn gh wide" style="margin-top:12px" data-a="logout">${ic("out")}تسجيل خروج</button><div class="credit" style="text-align:center">تصميم وبرمجة <b>علي مالك</b></div></div></div>`}
const saveCat=async()=>{try{await fs.doc("hub/catalog").set(CAT);return true}catch(e){err(e);return false}};
function siteForm(id){const p=id?CAT.products[id]:{color:COLORS[0],on:true,feats:[]};
  sheet(id?"تعديل موقع":"موقع جديد",`<label for="p_name" style="margin-top:0">اسم الموقع</label><input id="p_name" value="${esc(p.name||"")}"><label for="p_en">الاسم بالإنجليزي (اختياري)</label><input id="p_en" value="${esc(p.en||"")}" dir="ltr">
  <label for="p_tag">وصف بسطر واحد</label><input id="p_tag" value="${esc(p.tag||"")}"><label for="p_desc">الشرح</label><textarea id="p_desc">${esc(p.desc||"")}</textarea>
  <label for="p_feats">المزايا (كل سطر ميزة)</label><textarea id="p_feats" style="min-height:130px">${esc((p.feats||[]).join("\n"))}</textarea>
  <label for="p_price">السعر (اختياري، مثلاً: يبدأ من 150,000)</label><input id="p_price" value="${esc(p.price||"")}"><label for="p_demo">رابط تجربة (اختياري)</label><input id="p_demo" value="${esc(p.demo||"")}" dir="ltr" inputmode="url">
  <label>اللون</label><div class="swatches" id="p_col" data-v="${esc(p.color||COLORS[0])}">${COLORS.map(c=>`<button type="button" class="swc ${c===(p.color||COLORS[0])?"on":""}" style="background:${c}" data-a="pcol" data-c="${c}" aria-label="${c}"></button>`).join("")}</div>`,
  `<button class="btn gh grow" data-a="close">رجوع</button><button class="btn pri grow" data-a="sitesave" data-id="${id||""}">حفظ</button>`)}
function linkForm(id){const l=id?LINKS.find(x=>x.id===id):{prods:[]};const sel=new Set(l.prods||[]);
  sheet(id?"تعديل رابط":"رابط جديد",`<label for="l_name" style="margin-top:0">اسم الرابط (إلك بس، مثلاً: انستا)</label><input id="l_name" value="${esc(l.name||"")}"><label for="l_title">عنوان الصفحة (اختياري)</label><input id="l_title" value="${esc(l.title||"")}" placeholder="${esc((CAT.company||{}).tagline||"")}"><label for="l_sub">جملة تحت العنوان (اختياري)</label><input id="l_sub" value="${esc(l.sub||"")}">
  <label>المواقع اللي تطلع بهذا الرابط</label><div class="muted small">إذا ما تختار شي تطلع كل المواقع الظاهرة.</div>${prods().map(p=>`<label class="ck" style="color:var(--ink);font-size:15px"><input type="checkbox" class="l_p" value="${p.id}" ${sel.has(p.id)?"checked":""}><span>${esc(p.name)}</span></label>`).join("")}`,
  `<button class="btn gh grow" data-a="close">رجوع</button><button class="btn pri grow" data-a="linksave" data-id="${id||""}">${id?"حفظ":"أنشئ الرابط"}</button>`)}
function orderSheet(id){const o=ORDERS.find(x=>x.id===id);if(!o)return;const s=ST[o.status]||ST.new,w=waNum(o.phone),msg=encodeURIComponent(`هلا ${o.name||""}، وياك ${(CAT.company||{}).ar||"AM"} بخصوص طلبك (${o.prodName||""}).`);
  sheet("طلب "+(o.no||""),`<div class="row" style="margin-bottom:6px"><span class="pill p-${s[1]}">${s[0]}</span><span class="muted small" style="margin-inline-start:auto">${dt(o.at)}</span></div>
  <div class="kv"><span>الاسم</span><span><b>${esc(o.name)}</b></span></div><div class="kv"><span>الهاتف</span><span class="num">${esc(o.phone)}</span></div><div class="kv"><span>الموقع المطلوب</span><span>${esc(o.prodName||"—")}</span></div><div class="kv"><span>نوع الطلب</span><span>${esc(o.type||"—")}</span></div><div class="kv"><span>جاي من رابط</span><span>${esc(o.linkName||"—")}</span></div>
  ${o.note?`<div style="margin-top:10px"><div class="muted small">ملاحظات العميل</div><div class="card" style="box-shadow:none;background:var(--panel2);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere">${esc(o.note)}</div></div>`:""}
  <div class="row" style="margin-top:12px;gap:8px;flex-wrap:wrap"><a class="btn pri grow" href="https://wa.me/${w}?text=${msg}" target="_blank" rel="noopener">${ic("wa")}واتساب</a><a class="btn gh grow" href="tel:${esc(digits(o.phone))}">${ic("phone")}اتصال</a></div>
  <label>غيّر الحالة</label><div class="chips" style="flex-wrap:wrap">${Object.keys(ST).map(k=>`<button class="chip ${o.status===k?"on":""}" data-a="ostatus" data-id="${o.id}" data-k="${k}">${ST[k][0]}</button>`).join("")}</div>
  <label for="o_note">ملاحظاتك (إلك بس)</label><textarea id="o_note">${esc(o.adminNote||"")}</textarea>`,
  `<button class="btn gh" data-a="odel" data-id="${o.id}" aria-label="حذف">${ic("trash")}</button><button class="btn pri grow" data-a="onote" data-id="${o.id}">حفظ الملاحظة</button>`)}
const ACT={
  go:t=>go(t.dataset.p),close:closeSheet,mode:()=>{setMode(document.documentElement.dataset.theme==="dark"?"light":"dark");render()},setmode:t=>{setMode(t.dataset.m);render()},
  snd:()=>{SOUND=!SOUND;localStorage.setItem("amhub_snd",SOUND?"1":"0");if(SOUND)beep();render()},
  logout:()=>confirmBox("تريد تسجل خروج؟","خروج",()=>auth.signOut()),
  of:t=>{OF=t.dataset.k;render()},copy:t=>copy(linkUrl(t.dataset.id)),
  order:t=>orderSheet(t.dataset.id),
  ostatus:async t=>{try{await fs.doc("hub_orders/"+t.dataset.id).update({status:t.dataset.k});toast("تغيّرت الحالة");const o=ORDERS.find(x=>x.id===t.dataset.id);if(o){o.status=t.dataset.k;orderSheet(o.id)}}catch(e){err(e)}},
  onote:async t=>{try{await fs.doc("hub_orders/"+t.dataset.id).update({adminNote:$("o_note").value.trim()});toast("انحفظت");closeSheet()}catch(e){err(e)}},
  odel:t=>{const id=t.dataset.id;confirmBox("تحذف هذا الطلب نهائياً؟","حذف",async()=>{try{await fs.doc("hub_orders/"+id).delete();toast("انحذف")}catch(e){err(e)}})},
  siteform:t=>siteForm(t.dataset.id),pcol:t=>{$("p_col").dataset.v=t.dataset.c;$("p_col").querySelectorAll(".swc").forEach(b=>b.classList.toggle("on",b===t))},
  sitesave:async t=>{const name=$("p_name").value.trim();if(!name){toast("اكتب اسم الموقع");return}let demo=$("p_demo").value.trim();if(demo&&!/^https?:\/\//i.test(demo))demo="https://"+demo;
    const id=t.dataset.id||("p"+rid(5)),old=CAT.products[id]||{},mx=Math.max(0,...prods().map(p=>p.ord||0));
    CAT.products[id]={ord:old.ord||mx+1,on:old.on!==false,color:$("p_col").dataset.v,name,en:$("p_en").value.trim(),tag:$("p_tag").value.trim(),desc:$("p_desc").value.trim(),feats:$("p_feats").value.split("\n").map(s=>s.trim()).filter(Boolean),price:$("p_price").value.trim(),demo};
    if(await saveCat()){toast("انحفظ");closeSheet()}},
  siteon:async t=>{const p=CAT.products[t.dataset.id];p.on=p.on===false;await saveCat()},
  sitemv:async t=>{const ps=prods(),i=ps.findIndex(p=>p.id===t.dataset.id),j=i+ +t.dataset.d;if(j<0||j>=ps.length)return;[ps[i],ps[j]]=[ps[j],ps[i]];ps.forEach((p,k)=>CAT.products[p.id].ord=k+1);await saveCat()},
  sitedel:t=>{const id=t.dataset.id;confirmBox("تحذف موقع «"+CAT.products[id].name+"»؟","حذف",async()=>{delete CAT.products[id];if(await saveCat())toast("انحذف")})},
  linkform:t=>linkForm(t.dataset.id),
  linksave:async t=>{const name=$("l_name").value.trim()||"رابط",d={name,title:$("l_title").value.trim(),sub:$("l_sub").value.trim(),prods:[...document.querySelectorAll(".l_p:checked")].map(c=>c.value)};
    try{if(t.dataset.id){await fs.doc("hub_links/"+t.dataset.id).update(d);toast("انحفظ")}else{const id=rid(6);await fs.doc("hub_links/"+id).set(Object.assign(d,{on:true,views:0,at:firebase.firestore.FieldValue.serverTimestamp()}));toast("صار الرابط جاهز");copy(linkUrl(id))}closeSheet()}catch(e){err(e)}},
  linkon:async t=>{const l=LINKS.find(x=>x.id===t.dataset.id);try{await fs.doc("hub_links/"+l.id).update({on:l.on===false})}catch(e){err(e)}},
  linkdel:t=>{const id=t.dataset.id;confirmBox("تحذف هذا الرابط؟ اللي يفتحه بعدين ما راح يشتغل عنده.","حذف",async()=>{try{await fs.doc("hub_links/"+id).delete();toast("انحذف")}catch(e){err(e)}})},
  savecompany:async()=>{CAT.company={ar:$("c_ar").value.trim(),en:$("c_en").value.trim(),tagline:$("c_tag").value.trim(),phone:digits($("c_ph").value),insta:$("c_ig").value.trim().replace(/^@/,""),about:$("c_ab").value.trim()};if(await saveCat())toast("انحفظت")},
  savetypes:async()=>{CAT.types=$("c_types").value.split("\n").map(s=>s.trim()).filter(Boolean);if(await saveCat())toast("انحفظت")},
  /* public */
  ptoggle:t=>{const d=$("det_"+t.dataset.id),o=d.hidden;d.hidden=!o;t.innerHTML=(o?"سدّ التفاصيل":"التفاصيل")+ic(o?"up":"down")},
  porder:t=>pubOrder(t.dataset.id),psend:()=>pubSend()
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&ACT[t.dataset.a]){if(t.tagName!=="A")e.preventDefault();ACT[t.dataset.a](t,e)}else if(e.target.id==="sw")closeSheet()});

/* ================= public page (the link) ================= */
let PL=null,PC=null,PSEL=null;
async function bootPublic(){
  setTimeout(()=>{if(!PC&&!$("gate").hidden)$("gmsg").textContent="الاتصال بطيء… لحظة"},7000);
  let ls,cs;try{[ls,cs]=await Promise.all([fs.doc("hub_links/"+LINK).get(),fs.doc("hub/catalog").get()])}catch(e){$("gmsg").textContent="ما گدر يفتح الصفحة، حاول مرة ثانية";return}
  if(!ls.exists||ls.data().on===false||!cs.exists){$("gmsg").textContent="هذا الرابط مو شغّال حالياً";return}
  PL=Object.assign({id:ls.id},ls.data());PC=Object.assign({company:{},products:{},types:[]},cs.data());
  if(!sessionStorage.getItem("amv_"+LINK)){sessionStorage.setItem("amv_"+LINK,"1");fs.doc("hub_links/"+LINK).update({views:firebase.firestore.FieldValue.increment(1)}).catch(()=>{})}
  renderPublic()}
function pubProds(){let ps=Object.entries(PC.products||{}).map(([id,p])=>Object.assign({id},p)).filter(p=>p.on!==false).sort((a,b)=>(a.ord||0)-(b.ord||0));if((PL.prods||[]).length)ps=ps.filter(p=>PL.prods.includes(p.id));return ps}
function renderPublic(){const c=PC.company||{},ps=pubProds(),w=waNum(c.phone);
  document.title=(c.ar||"AM")+" · اطلب نظامك";
  $("pub").innerHTML=`<div class="pg"><div class="ptop"><svg style="color:var(--ink)"><use href="#i-logo"/></svg><div><div class="wm">AM</div><small>${esc((c.en||"AM TECH SOLUTIONS").replace(/^AM\s*/i,""))}</small></div></div>
  <div class="phero"><h1>${esc(PL.title||c.tagline||c.ar||"")}</h1><p>${esc(PL.sub||"اختار النظام اللي يناسب شغلك واطلبه، ونتواصل وياك.")}</p></div>
  <div>${ps.map((p,i)=>`<article class="card pc"><div class="hd"><div class="no" style="color:${esc(p.color||"#ec1c32")}">${String(i+1).padStart(2,"0")}</div><div class="grow">${p.en?`<div class="en" style="color:${esc(p.color||"#ec1c32")}">${esc(p.en)}</div>`:""}<h2>${esc(p.name)}</h2><div class="muted">${esc(p.tag||"")}</div></div></div>
   <div class="det" id="det_${p.id}" hidden>${p.desc?`<p>${esc(p.desc)}</p>`:""}${(p.feats||[]).length?`<ul>${p.feats.map(f=>`<li><svg class="i" style="color:${esc(p.color||"#ec1c32")}"><use href="#i-check"/></svg><span>${esc(f)}</span></li>`).join("")}</ul>`:""}${p.price?`<div class="price">${esc(p.price)}</div>`:""}${p.demo?`<div style="margin-top:10px"><a class="btn gh sm" href="${esc(p.demo)}" target="_blank" rel="noopener">${ic("ext")}شوف الموقع</a></div>`:""}</div>
   <div class="ft"><button class="btn gh" data-a="ptoggle" data-id="${p.id}">التفاصيل${ic("down")}</button><button class="btn pri" data-a="porder" data-id="${p.id}">اطلبه هسه</button></div></article>`).join("")}</div>
  <div class="card cta2"><b style="font-family:Cairo;font-size:19px">تريد موقع أو نظام خاص بيك؟</b><div class="muted" style="margin:4px 0 12px">گلنا فكرتك ونسويها إلك من الصفر.</div><button class="btn pri" data-a="porder" data-id="">اطلب موقع خاص</button></div>
  ${c.about?`<p class="muted" style="text-align:center;margin-top:18px;white-space:pre-wrap">${esc(c.about)}</p>`:""}
  <div class="pfoot">${c.phone?`<a class="btn gh" href="https://wa.me/${w}" target="_blank" rel="noopener">${ic("wa")}واتساب</a>`:""}${c.insta?`<a class="btn gh" href="https://instagram.com/${encodeURIComponent(c.insta)}" target="_blank" rel="noopener">${ic("insta")}<span dir="ltr">@${esc(c.insta)}</span></a>`:""}</div>
  <div class="credit" style="text-align:center">تصميم وبرمجة <b>علي مالك</b></div></div>`;
  $("gate").hidden=true;$("pub").hidden=false}
function pubOrder(id){PSEL=id||"";const ps=pubProds(),types=(PC.types&&PC.types.length?PC.types:DEF.types),custom=!id;
  sheet("طلب جديد",`<label for="f_name" style="margin-top:0">اسمك</label><input id="f_name" autocomplete="name" maxlength="80"><label for="f_phone">رقم الهاتف</label><input id="f_phone" inputmode="tel" dir="ltr" placeholder="07xxxxxxxxx" autocomplete="tel" maxlength="20">
  <label for="f_prod">الموقع المطلوب</label><select id="f_prod">${ps.map(p=>`<option value="${p.id}" ${p.id===id?"selected":""}>${esc(p.name)}</option>`).join("")}<option value="" ${custom?"selected":""}>موقع خاص (غير المعروض)</option></select>
  <label for="f_type">نوع الطلب</label><select id="f_type">${types.map((t,i)=>`<option ${custom&&/خاص|صفر/.test(t)?"selected":""}>${esc(t)}</option>`).join("")}</select>
  <label for="f_note">تفاصيل (اختياري)</label><textarea id="f_note" maxlength="1500" placeholder="اسم شغلك، شنو تحتاج بالضبط…"></textarea><div class="small" id="f_err" style="color:var(--bad);margin-top:8px" hidden></div>`,
  `<button class="btn gh" data-a="close">رجوع</button><button class="btn pri grow" id="f_send" data-a="psend">إرسال الطلب</button>`)}
async function pubSend(){const name=$("f_name").value.trim(),ph=digits($("f_phone").value),e=$("f_err"),bad=m=>{e.textContent=m;e.hidden=false};
  if(name.length<2)return bad("اكتب اسمك");if(!/^(\+?964|0)?7\d{9}$/.test(ph))return bad("رقم الهاتف مو صحيح، اكتبه مثل 07xxxxxxxxx");
  const pid=$("f_prod").value,p=(PC.products||{})[pid],no="AM-"+String(Date.now()).slice(-6),b=$("f_send");b.disabled=true;b.textContent="دا يرسل…";
