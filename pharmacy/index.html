<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="app-build" content="2026.11.13-4">
<meta name="theme-color" content="#0b0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AM PHARMA">
<title>AM PHARMA — نظام إدارة الصيدليات</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>(function(){try{var t=localStorage.getItem("ph_theme")||"auto";if(t==="auto")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;var a=localStorage.getItem("ph_accent");if(a)document.documentElement.style.setProperty("--accent",a)}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Orbitron:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--void:#0b0c10;--panel:#121319;--panel2:#171920;--panel3:#1e2029;--line:rgba(255,255,255,.065);--line2:rgba(255,255,255,.11);
 --ink:#eceef2;--dim:#99a0ab;--faint:#5d636e;--ok:#3ccf82;--warn:#f2b03d;--bad:#f2596a;
 --accent:#19c3e0;--accent2:#5fd8ec;--acc-rgb:25,195,224;--accent-soft:rgba(var(--acc-rgb),.12);--accent-glow:rgba(var(--acc-rgb),.16);--accent-ink:#06141a;
 --r:14px;--r-sm:10px;--top:60px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);color-scheme:dark;
 --display:"Cairo","IBM Plex Sans Arabic",sans-serif;--body:"IBM Plex Sans Arabic","Cairo",sans-serif;--tech:"Orbitron","JetBrains Mono",monospace;--mono:"JetBrains Mono",monospace}
html[data-theme="light"]{--void:#f3f4f7;--panel:#fff;--panel2:#f6f7f9;--panel3:#eceef2;--line:rgba(16,22,34,.08);--line2:rgba(16,22,34,.14);
 --ink:#161a22;--dim:#5b6270;--faint:#959ba6;--ok:#17925a;--warn:#b4760f;--bad:#d3374a;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--body);background:var(--void);color:var(--ink);font-size:15px;line-height:1.5;touch-action:manipulation;overflow-x:hidden;
 background-image:radial-gradient(ellipse 70% 40% at 50% -5%,var(--accent-glow),transparent 60%),var(--bgpat,none)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:15px}
button{cursor:pointer;border:0;background:none}
a{color:var(--accent);text-decoration:none}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.num{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.tech{font-family:var(--tech);direction:ltr;unicode-bidi:isolate;letter-spacing:2px;text-transform:uppercase}
[hidden]{display:none!important}
/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:1fr 280px;min-height:100%}
#side{position:sticky;top:0;height:100vh;border-inline-start:1px solid var(--line);background:var(--panel);padding:22px 18px;display:flex;flex-direction:column;gap:14px;order:2}
#main{order:1;max-width:1240px;width:100%;margin:0 auto;padding:22px 22px 60px}
#topbar{display:none}
.brand{display:flex;align-items:center;gap:12px}
.brand .wm{font-family:var(--tech);font-size:18px;letter-spacing:3px;color:var(--ink);direction:ltr}
.brand .wm em{font-style:normal;color:var(--accent)}
.brand small{display:block;font-size:11px;color:var(--dim);font-family:var(--body);letter-spacing:0}
.logo{width:40px;height:40px;flex:none}
.nav{display:grid;gap:4px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-sm);color:var(--dim);text-align:right;width:100%;transition:background .15s,color .15s}
.nav button .ix{font-family:var(--mono);font-size:11px;color:var(--faint);width:18px}
.nav button svg{width:20px;height:20px}
.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav button.on svg{color:var(--accent);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.2)}}
.cta-side{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-family:var(--display);font-size:16px;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);box-shadow:0 10px 30px -10px var(--accent)}
.cta-side:active{transform:scale(.98)}
.side-clock{margin-top:auto;padding:12px;border-radius:var(--r-sm);background:var(--panel2);border:1px solid var(--line)}
.side-clock b{font-family:var(--mono);font-size:22px;display:block;direction:ltr;text-align:right}
.side-clock small{color:var(--dim);font-size:12px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.sync.off i{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.ucard{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel2)}
.ucard .av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-family:var(--display)}
.ucard b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ucard small{color:var(--dim);font-size:12px}
.ucard .ibs{margin-inline-start:auto;display:flex;gap:4px}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--dim);background:transparent;position:relative}
.ib:hover{background:var(--panel3);color:var(--ink)}
.ib .bd{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-family:var(--mono);display:grid;place-items:center;padding:0 4px}
/* ---------- sections ---------- */
.sec{display:none;animation:fadein .25s}
.sec.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.ey{font-family:var(--tech);font-size:11px;letter-spacing:2px;color:var(--accent);direction:ltr;text-align:right;display:flex;align-items:center;gap:8px}
.ey i{flex:1;height:1px;background:var(--line2)}
h1{font-family:var(--display);font-weight:800;font-size:26px;margin:4px 0 16px;line-height:1.3}
h2{font-family:var(--display);font-weight:800;font-size:18px}
.sub{color:var(--dim);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;box-shadow:0 10px 30px -22px rgba(0,0,0,.6)}
.card.br::before,.card.br::after{content:"";position:absolute;width:12px;height:12px;border:1.5px solid var(--accent);opacity:.55;pointer-events:none}
.card.br::before{top:-1px;right:-1px;border-left:0;border-bottom:0;border-radius:0 var(--r) 0 0}
.card.br::after{bottom:-1px;left:-1px;border-right:0;border-top:0;border-radius:0 0 0 var(--r)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.grid>*{min-width:0}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.kpi{padding:14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer}
.kpi::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--c,var(--accent))}
.kpi small{display:block;color:var(--dim);font-size:12px}
.kpi b{display:block;font-family:var(--mono);font-size:22px;margin-top:4px;direction:ltr;text-align:right}
.kpi .tr{font-size:11px;color:var(--dim)}
.kpi.warn{--c:var(--warn)}.kpi.bad{--c:var(--bad)}.kpi.ok{--c:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:var(--r-sm);font-weight:600;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);transition:transform .1s,background .15s;min-height:42px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:800;font-family:var(--display)}
.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.danger{background:rgba(242,89,106,.12);color:var(--bad);border-color:transparent}
.btn.ok{background:rgba(60,207,130,.12);color:var(--ok);border-color:transparent}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:8px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel3);color:var(--dim)}
.pill.ok{background:rgba(60,207,130,.14);color:var(--ok)}.pill.warn{background:rgba(242,176,61,.16);color:var(--warn)}.pill.bad{background:rgba(242,89,106,.14);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:7px 14px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:600}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip b{font-family:var(--mono);margin-inline-start:4px}
.srch{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:0 12px;height:48px}
.srch input{flex:1;background:none;border:0;outline:0;height:100%;min-width:0}
.srch svg{color:var(--dim)}
.fld{display:grid;gap:6px;margin-bottom:12px}
.fld label{font-size:13px;color:var(--dim);font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;outline:0;min-height:44px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld .hint{font-size:12px;color:var(--faint)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row2>*,.row3>*{min-width:0}
.list{display:grid;gap:8px}
.it{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);position:relative;min-width:0}
.it::before{content:"";position:absolute;inset-inline-start:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--c,var(--line2))}
.it.ok{--c:var(--ok)}.it.warn{--c:var(--warn)}.it.bad{--c:var(--bad)}.it.acc{--c:var(--accent)}
.it .av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-family:var(--display);background:var(--panel3);color:var(--dim);border:2px solid var(--c,var(--line2))}
.it .tx{flex:1;min-width:0}
.it .tx b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .tx small{display:block;color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .acts{display:flex;gap:6px;flex:none}
.it .rt{text-align:left;flex:none}
.it .rt b{font-family:var(--mono);display:block;direction:ltr}
.it .rt small{color:var(--dim);font-size:11px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:right;color:var(--dim);font-weight:600;padding:8px;border-bottom:1px solid var(--line2);font-size:12px}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--panel2)}
.empty{text-align:center;color:var(--faint);padding:40px 10px}
.empty b{display:block;font-family:var(--display);color:var(--dim);font-size:16px;margin-top:8px}
.bar{height:6px;border-radius:3px;background:var(--panel3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:3px;transition:width .6s}
.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:12px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border-radius:9px;color:var(--dim);font-weight:600}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 2px 8px -4px rgba(0,0,0,.5)}
/* toast / sheet / gate */
#toast{position:fixed;top:calc(12px + var(--sat));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--void);padding:10px 18px;border-radius:999px;font-weight:600;z-index:200;box-shadow:0 10px 30px -10px rgba(0,0,0,.6);max-width:92vw;animation:drop .25s}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;animation:fadein .2s}
#sheet{overflow-x:hidden;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:20px;z-index:91;animation:fadein .2s}
#sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
#sheet .hd h2{font-size:18px}
#sheet .grab{display:none}
.sheet-actions{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:-20px;background:var(--panel);padding:12px 0 0}
.sheet-actions .btn{flex:1}
#gate{position:fixed;inset:0;z-index:150;background:var(--void);display:grid;place-items:center;padding:20px;background-image:radial-gradient(ellipse 70% 40% at 50% -5%,var(--accent-glow),transparent 60%)}
.gbox{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px 24px;text-align:center}
.core{width:120px;height:120px;margin:0 auto 14px;position:relative;display:grid;place-items:center}
.core i{position:absolute;inset:0;border-radius:50%}
.core .r1{border:2px dashed var(--accent);opacity:.5;animation:spin 16s linear infinite}
.core .r2{inset:12px;border:2px solid transparent;border-top-color:var(--accent);border-right-color:var(--accent);animation:spin 3.2s linear infinite reverse}
.core .r3{inset:24px;border:1px solid var(--line2);animation:spin 6s linear infinite}
.core .gl{inset:20px;background:radial-gradient(var(--accent-glow),transparent 70%);animation:pulse 2.4s ease-in-out infinite}
.core svg{width:52px;height:52px;position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.25);opacity:.6}}
.core.sm{width:64px;height:64px;margin:0}.core.sm svg{width:30px;height:30px}.core.sm .r2{inset:7px}.core.sm .r3{inset:14px}
.prog{height:3px;background:var(--panel3);border-radius:2px;overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;width:40%;background:var(--accent);animation:slide 1.1s linear infinite}
@keyframes slide{from{transform:translateX(120%)}to{transform:translateX(-300%)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(6px)}40%,80%{transform:translateX(-6px)}}
.credit{font-size:12px;color:var(--faint);margin-top:16px}
.credit b{color:var(--dim)}
/* POS */
.pos{display:grid;grid-template-columns:1.2fr .9fr;gap:14px;align-items:start}
.pos>*{min-width:0}
.res{display:grid;gap:6px;max-height:60vh;overflow:auto;margin-top:8px}
.ri{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.ri:active{background:var(--accent-soft)}
.res>*{min-width:0}
.ri.on{border-color:var(--accent);background:var(--accent-soft)}
.ri b{white-space:normal!important;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;unicode-bidi:plaintext;text-align:start}
.ri small{unicode-bidi:plaintext;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .tx b,.it .tx small,.cl b{unicode-bidi:plaintext}
#cbC{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}#cbC::-webkit-scrollbar{display:none}#cbC .chip{flex:none}
.ri .pill svg{width:14px;height:14px}
.ri .tx{flex:1;min-width:0;overflow:hidden}.ri b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ri small{color:var(--dim);font-size:12px}
.ri .pr{font-family:var(--mono);color:var(--accent);direction:ltr}
.cart{position:sticky;top:12px}
.cl{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.cl .tx{flex:1;min-width:0}.cl b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cl small{color:var(--dim);font-size:12px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.qty button{width:32px;height:32px;display:grid;place-items:center;color:var(--accent);font-size:18px}
.qty input{width:44px;text-align:center;border:0;background:var(--panel2);height:32px;font-family:var(--mono);outline:0}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.tot.big{font-size:20px;font-weight:800;font-family:var(--display);border-top:1px solid var(--line2);margin-top:6px;padding-top:10px}
.tot .num{color:var(--accent)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel2);padding:4px;border-radius:10px}
.seg2 button{padding:9px;border-radius:8px;color:var(--dim);font-weight:700}
.seg2 button.on{background:var(--accent);color:var(--accent-ink)}
/* receipt */
.rc{font-family:var(--body);background:#fff;color:#111;padding:16px;border-radius:12px;width:100%;max-width:360px;margin:0 auto;font-size:13px}
.rc h3{text-align:center;font-family:var(--display);font-size:18px}
.rc .c{text-align:center;color:#555;font-size:12px}
.rc table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
.rc td,.rc th{padding:5px 2px;border-bottom:1px dashed #ddd;text-align:right}
.rc .n{font-family:var(--mono);direction:ltr;text-align:left}
.rc .t{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-top:6px}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart .b{fill:var(--accent);opacity:.85}
.chart text{fill:var(--dim);font-size:11px;font-family:var(--mono)}
/* ---------- mobile ---------- */
.abnav{display:none}
@media (max-width:900px){
 #app{display:block}
 #side{display:none}
 #topbar{display:flex;position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + var(--sat)) 14px 10px;align-items:center;gap:10px}
 #topbar .wm{font-family:var(--tech);font-size:15px;letter-spacing:2px;direction:ltr}
 #topbar .wm em{font-style:normal;color:var(--accent)}
 #topbar .clk{margin-inline-start:auto;font-family:var(--mono);font-size:13px;color:var(--dim)}
 #main{padding:14px 14px calc(96px + var(--sab))}
 h1{font-size:22px}
 .abnav{display:grid;grid-template-columns:repeat(2,1fr) 74px repeat(2,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sab))}
 .abnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--dim);font-size:11px;border-radius:10px;min-width:0}
 .abnav button svg{width:22px;height:22px}
 .abnav button.on{color:var(--accent)}
 .abnav .bl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .abnav .mid{position:relative}
 .abnav .mid i{position:absolute;top:-26px;left:50%;width:56px;height:56px;margin-left:-28px;transform:rotate(45deg);border-radius:14px;background:var(--accent);box-shadow:0 10px 24px -8px var(--accent);display:grid;place-items:center}
 .abnav .mid i svg{transform:rotate(-45deg);color:var(--accent-ink);width:26px;height:26px}
 .abnav .mid .bl{margin-top:28px}

  r.onload=()=>{const im=new Image();im.onload=()=>{const M=2200,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res({inlineData:{mimeType:"image/jpeg",data:c.toDataURL("image/jpeg",.88).split(",")[1]}})};im.onerror=()=>rej({code:"img"});im.src=r.result};r.readAsDataURL(f)})}
const toks=s=>norm(s).replace(/[^a-z0-9؀-ۿ.]+/g," ").split(" ").filter(w=>w.length>1);
function simScore(a,b){const A=toks(a),B=toks(b);if(!A.length||!B.length)return 0;const SB=new Set(B);let hit=0;A.forEach(w=>{if(SB.has(w))hit++});const nA=A.filter(w=>/\d/.test(w)),nB=new Set(B.filter(w=>/\d/.test(w)));let pen=0;if(nA.length&&nB.size&&!nA.some(w=>nB.has(w)))pen=.35;return Math.max(0,hit/Math.max(A.length,B.length)-pen)}
function bestProd(name){let best=null,sc=0;prodList().forEach(p=>{const s=Math.max(simScore(name,p.n),p.bar&&normD(name).includes(p.bar)?1:0);if(s>sc){sc=s;best=p}});return sc>=.5?best:null}
function bestCat(name,gen){if(!CAT)return null;let best=null,sc=0;const q=(gen||"")+" "+name;CAT.forEach(x=>{const s=simScore(q,x.n+" "+x.g);if(s>sc){sc=s;best=x}});return sc>=.45?best:null}

function scanReview(j){const rows=j.items.map(it=>{const qty=Math.max(0,num(it.qty)),bonus=Math.max(0,num(it.bonus));let price=num(it.price);if(!price&&num(it.line_total)&&qty)price=Math.round(num(it.line_total)/qty);const name=String(it.name||"").trim();const p=bestProd(name);const c=p?null:bestCat(name,it.generic);
    let exp=String(it.exp||"").trim();if(!/^\d{4}-\d{2}$/.test(exp))exp="";return{name,gen:String(it.generic||""),qty,bonus,price,exp,unsure:!!it.unsure,match:p?p.id:(c?"cat:"+c.i:"new"),on:qty+bonus>0}});

function backup(){const o={v:BUILD,t:Date.now(),acct:ACCT,products:DB.products,parties:DB.parties,settings:DB.settings,sales:DB.sales,purch:DB.purch,pay:DB.pay};const b=new Blob([JSON.stringify(o)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`pharma-backup-${ymd(Date.now())}.json`;a.click()}

  return head("00 · ADMIN CONSOLE","الصيدليات المشتركة")+`<div class="card br" style="margin-bottom:12px"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="av" style="width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)">${ic("shield")}</span><div style="flex:1;min-width:200px"><b>فتح صيدلية جديدة أو تمديد اشتراكها يصير من AM NET</b><div class="sub">AM NET ← إضافة عميل ← صيدلية. صاحب الصيدلية يدخل هنا بكلمة سره ويكون مدير صيدليته.</div></div></div></div>
  <div class="kpis" style="margin-bottom:12px"><div class="kpi ok"><small>فعّالة</small><b>${PH.filter(a=>st(a)==="ok").length}</b></div><div class="kpi warn"><small>تنتهي خلال أسبوع</small><b>${PH.filter(a=>st(a)==="ok"&&near(a)).length}</b></div><div class="kpi bad"><small>منتهية / موقوفة</small><b>${PH.filter(a=>st(a)!=="ok").length}</b></div></div>
  <div class="srch" style="margin-bottom:10px">${ic("search")}<input id="aQ" placeholder="دوّر صيدلية" value="${esc(AQ)}"></div>
  <div class="list">${L.map(a=>`<div class="it ${st(a)==="ok"?(near(a)?"warn":"ok"):"bad"}" data-a="acct-open" data-id="${a.id}"><span class="av" style="border-color:${esc(a.accent||"var(--accent)")}">${esc(ini(a.biz||a.name))}</span><span class="tx"><b>${esc(a.biz||a.name)} ${isLife(a)?'<span class="pill acc">∞</span>':""}</b><small>${esc(a.name||"")}${a.phone?" · "+esc(a.phone):""} · ${isLife(a)?"مدى الحياة":"ينتهي "+dstr(tsMs(a.expiresAt))}</small></span><span class="pill ${st(a)==="ok"?"ok":"bad"}">${{ok:"فعّال",off:"موقوف",expired:"منتهي",missing:"—",wrong:"—"}[st(a)]}</span></div>`).join("")||`<div class="empty">${ic("shield")}<b>ماكو صيدليات بعد</b>افتح أول صيدلية من AM NET</div>`}</div>`}
function acctSheet(id){const a=ACCTS.find(x=>x.id===id);if(!a)return;
  openSheet(sheetHd(esc(a.biz||a.name),isLife(a)?"مدى الحياة":"ينتهي "+dstr(tsMs(a.expiresAt)))+`<div class="list"><div class="it"><span class="tx"><small>صاحب الصيدلية</small><b>${esc(a.name||"—")}</b></span></div><div class="it"><span class="tx"><small>الهاتف</small><b class="num">${esc(a.phone||"—")}</b></span></div><div class="it"><span class="tx"><small>الحالة</small><b>${{ok:"فعّال",off:"موقوف",expired:"منتهي"}[accState(a)]||"—"}</b></span></div></div>
  <p class="sub" style="margin-top:10px">التمديد والإيقاف وتغيير كلمة السر من AM NET.</p>
  <div class="sheet-actions"><button class="btn primary" id="acOpen">${ic("eye")} فتح لوحتها</button><button class="btn" data-x>إغلاق</button></div>`,s=>{s.querySelector("#acOpen").onclick=()=>{closeSheet();VIEWAS=a;ACCOUNT=a;attachAccount(id);applySettings();go("home")}})}
/* ================= global events ================= */
document.addEventListener("input",e=>{const t=e.target;if(t.id==="stQ"){STQ=t.value;clearTimeout(window._stT);window._stT=setTimeout(render,180)}else if(t.id==="posQ")posSearch();else if(t.id==="buyQ"){clearTimeout(window._bqT);window._bqT=setTimeout(buySearch,150)}else if(t.id==="posDisc"){POS.disc=num(t.value)}else if(t.id==="aQ"){AQ=t.value;clearTimeout(window._aT);window._aT=setTimeout(render,180)}else if(t.id==="cbQ"){CB.q=t.value;clearTimeout(window._cbT);window._cbT=setTimeout(cbList,150)}else if(t.dataset.sc&&SCAN){const r=SCAN.rows[+t.dataset.i];const k=t.dataset.sc;if(r&&k!=="on"&&k!=="match"){r[k]=k==="name"||k==="exp"?t.value:num(t.value);if(k!=="name"&&k!=="exp"){const sum=SCAN.rows.filter(x=>x.on).reduce((a,x)=>a+x.qty*x.price,0);const b=qs("#sheet .tot.big .num");if(b)b.textContent=fmt(sum)}}}else if(t.dataset.a==="pl"){const l=PL[+t.dataset.i];if(l)l[t.dataset.k]=t.dataset.k==="exp"?t.value:num(t.value);const tot=PL.reduce((s,l)=>s+l.q*l.cost,0);const b=qs("#buyBody .tot .num");if(b)b.textContent=fmt(tot)}else if(t.dataset.a==="cart-qi"){const l=CART[+t.dataset.i];if(l){l.q=Math.max(1,num(t.value));}}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.sc&&SCAN){const r=SCAN.rows[+t.dataset.i];if(r){if(t.dataset.sc==="on"){r.on=t.checked;drawScan()}else if(t.dataset.sc==="match"){r.match=t.value;drawScan()}}return}if(t.dataset.a==="cart-qi")refreshCart();else if(t.id==="bPaid"||t.id==="bSup"||t.id==="bRef")buyRefresh();else if(t.id==="rpA"||t.id==="rpB"){RP.a=qs("#rpA").value?sod(new Date(qs("#rpA").value).getTime()):0;RP.b=qs("#rpB").value?sod(new Date(qs("#rpB").value).getTime()):0;render()}else if(t.dataset.accpick!=null){applyAccent(t.value);if(ROLE==="owner")saveSettings({accent:t.value});render()}else if(t.id==="posCus")POS.cus=t.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="posQ"){e.preventDefault();const f=qs("#posRes .ri[data-id]");if(f){cartAdd(f.dataset.id);e.target.value="";posSearch()}}if(e.key==="Escape")closeSheet()});
document.addEventListener("click",async e=>{const cbc=e.target.closest("[data-cbc]");if(cbc){CB.c=cbc.dataset.cbc;cbDraw();return}
  const b=e.target.closest("[data-a],[data-stf],[data-dt],[data-exf],[data-rp],[data-acc],[data-theme],[data-f]");if(!b)return;const a=b.dataset.a,d=b.dataset;
  if(d.stf){STF=d.stf;render();return}if(d.dt){DT=d.dt;render();return}if(d.exf){EXF=d.exf;render();return}if(d.rp){RP.k=d.rp;render();return}if(d.acc){applyAccent(d.acc);if(ROLE==="owner")saveSettings({accent:d.acc});render();return}if(d.theme){setTheme(d.theme);render();return}
  if(d.f&&d.go){if(d.go==="stock")STF=d.f;if(d.go==="expiry")EXF=d.f;return}
  switch(a){
   case "prod-new":prodSheet();break;case "prod-open":prodSheet(d.id);break;case "batch-add":batchSheet(d.id);break;case "batch-edit":batchSheet(d.id,d.b);break;
   case "cart-add":cartAdd(d.id);break;case "cart-q":{const l=CART[+d.i];if(l){l.q+=+d.d;if(l.q<=0)CART.splice(+d.i,1)}refreshCart();break}case "cart-rm":CART.splice(+d.i,1);refreshCart();break;case "cart-clear":CART.length=0;refreshCart();break;
   case "cart-pc":{e.preventDefault();const l=CART[+d.i];const p=DB.products[l.p];l.pc=!l.pc;l.pr=unitPrice(p,l.pc);refreshCart();break}
   case "pay":POS.pay=d.v;POS.disc=num(qs("#posDisc").value);refreshCart();break;case "checkout":checkout();break;case "sale-open":saleOpen(d.id,d.m);break;
   case "cus-new":partySheet("cus");break;case "sup-new":partySheet("sup",null,!!qs("#buyBody"));break;case "party-open":partyOpen(d.k,d.id);break;case "party-edit":partySheet(d.k,d.id);break;case "pay-new":paySheet(d.k,d.id);break;
   case "party-del":confirmBox("حذف",`تحذف <b>${esc(DB.parties[d.k][d.id].n)}</b>؟`,"حذف",async()=>{delete DB.parties[d.k][d.id];closeSheet();render();await saveParties()},true);break;
   case "buy-new":buySheet();break;case "buy-open":buyOpen(d.id,d.m);break;case "pl-add":{const p=DB.products[d.id];if(!PL.some(l=>l.p===d.id))PL.push({p:d.id,n:p.n,q:1,cost:+p.cost||0,exp:""});qs("#buyQ").value="";buyRefresh();break}case "pl-rm":PL.splice(+d.i,1);buyRefresh();break;case "buy-save":buySave();break;case "buy-scan":buyScan();break;case "buy-back":SCAN=null;buySheet(false);break;case "scan-apply":scanApply();break;
   case "cat-browse":catBrowse();break;
   case "cat-new":{const x=CAT&&CAT[+d.ci];if(x)prodSheet(null,fromCat(x));break}
   case "cat-fill":{const x=CAT&&CAT[+d.ci];if(!x)break;$("pN").value=x.n;$("pS").value=x.g||"";$("pCat").value=x.c||"";$("pU").value=x.u||"علبة";$("pSug").innerHTML="";beep("click");break}
   case "cb-tog":{const i=+d.ci;if(inStock(CAT[i]))break;CB.sel.has(i)?CB.sel.delete(i):CB.sel.add(i);cbList();break}
   case "pl-cat":{const x=CAT&&CAT[+d.ci];if(!x)break;const id=uid();DB.products[id]=fromCat(x);await saveProducts([id]);PL.push({p:id,n:x.n,q:1,cost:0,exp:""});qs("#buyQ").value="";buyRefresh();toast("انضاف من الدليل — اكتب الكلفة وتاريخ الانتهاء");break}
   case "pl-newprod":{const n=qs("#buyQ").value.trim();const id=uid();DB.products[id]={n,sci:"",co:"",bar:"",unit:"علبة",pcs:1,cost:0,price:0,min:3,batches:{}};await saveProducts([id]);PL.push({p:id,n,q:1,cost:0,exp:""});qs("#buyQ").value="";buyRefresh();toast("انضاف — عدّل سعره من المخزون");break}
   case "exp-dispose":expAction(d.id,d.b,"dis");break;case "exp-return":expAction(d.id,d.b,"ret");break;
   case "xlsx-sales":xlsxSales();break;case "imp-xlsx":importSheet();break;case "backup":backup();break;
   case "staff-new":staffSheet();break;case "staff-open":staffSheet(d.id);break;case "acct-open":acctSheet(d.id);break;
   case "scan":scan(d.to);break;
  }});

/* barcode scan (camera) */
async function scan(to){if(!("BarcodeDetector" in window)){return toast("الكاميرا ما تدعم قراءة الباركود بهذا المتصفح — استخدم قارئ باركود أو اكتبه")}
  openSheet(sheetHd("مسح الباركود","وجّه الكاميرا على الباركود")+`<video id="scv" playsinline style="width:100%;border-radius:12px;background:#000;max-height:50vh"></video><div class="sheet-actions"><button class="btn" data-x>إلغاء</button></div>`,async s=>{try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});const v=s.querySelector("#scv");v.srcObject=st;await v.play();const det=new BarcodeDetector({formats:["ean_13","ean_8","code_128","upc_a","upc_e","qr_code"]});const tick=async()=>{if(!document.body.contains(v)){st.getTracks().forEach(t=>t.stop());return}try{const r=await det.detect(v);if(r.length){const val=r[0].rawValue;st.getTracks().forEach(t=>t.stop());closeSheet();const i=$(to);if(i){i.value=val;i.dispatchEvent(new Event("input",{bubbles:true}))}beep("click");return}}catch(e){}requestAnimationFrame(tick)};tick()}catch(e){toast("ما گدرت أفتح الكاميرا")}})}
