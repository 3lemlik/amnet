<!doctype html>
<html lang="ar" dir="rtl">
<head>
<title>المتجر</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="gs-build" content="1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المتجر">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#08080b">
<script>(function(){var d=document.documentElement;try{var m=localStorage.getItem("gs_mode")||"dark";if(m==="auto")m=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";d.setAttribute("data-theme",m);var a=localStorage.getItem("gs_acc");if(a)d.style.setProperty("--accent",a)}catch(e){d.setAttribute("data-theme","dark")}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Orbitron:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* General store: one file, two faces — the customer storefront (default) and the shop's command center (#admin). Same calm sci-fi language as AM NET. */
:root{
  --void:#08080b;--panel:#101015;--panel2:#16161d;--panel3:#1d1d26;--line:rgba(255,255,255,.065);--line2:rgba(255,255,255,.11);
  --ink:#eceef2;--dim:#9a9fab;--faint:#5d636e;
  --ok:#3ccf82;--ok-soft:rgba(60,207,130,.12);--warn:#f2b03d;--warn-soft:rgba(242,176,61,.13);--bad:#f2596a;--bad-soft:rgba(242,89,106,.12);
  --accent:#ec1c32;--acc-rgb:236,28,50;--accent-ink:#fff;--accent-soft:rgba(var(--acc-rgb),.12);
  --f-display:"Cairo","IBM Plex Sans Arabic",system-ui,sans-serif;--f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-tech:"Orbitron","JetBrains Mono",monospace;--f-mono:"JetBrains Mono",ui-monospace,monospace;
  --r:14px;--r-sm:10px;--side:260px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --shadow:0 18px 50px -20px rgba(0,0,0,.7);color-scheme:dark}
html[data-theme="light"]{--void:#f3f4f7;--panel:#fff;--panel2:#f6f7f9;--panel3:#eceef2;--line:rgba(16,22,34,.08);--line2:rgba(16,22,34,.14);
  --ink:#161a22;--dim:#5b6270;--faint:#959ba6;--ok:#17925a;--warn:#b4760f;--bad:#d3374a;--shadow:0 18px 50px -24px rgba(16,22,34,.35);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;touch-action:manipulation;min-height:100vh;
  background-image:radial-gradient(900px 480px at 70% -10%,rgba(var(--acc-rgb),.10),transparent 60%);background-attachment:fixed}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r-sm);padding:10px 12px;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s;min-width:0}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{border-color:rgba(var(--acc-rgb),.6);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.14)}
input.num::placeholder{font-family:var(--f-body)}
label{display:block;font-size:13px;color:var(--dim);margin-bottom:5px;font-weight:600}
.num{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.muted{color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-sm);padding:11px 16px;font-weight:700;font-size:14.5px;cursor:pointer;background:var(--accent);color:var(--accent-ink);transition:transform .12s,filter .2s,opacity .2s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line2)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.ok{background:var(--ok);color:#06240f}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.wa{background:#22c55e;color:#04210f}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn svg,.ic{width:18px;height:18px;flex:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;box-shadow:var(--shadow)}
.card.br::before,.card.br::after{content:"";position:absolute;width:12px;height:12px;border:1.5px solid var(--accent);opacity:.55;pointer-events:none}
.card.br::before{top:-1px;inset-inline-start:-1px;border-bottom:0;border-inline-end:0;border-start-start-radius:var(--r)}
.card.br::after{bottom:-1px;inset-inline-end:-1px;border-top:0;border-inline-start:0;border-end-end-radius:var(--r)}
.eyebrow{font-family:var(--f-tech);font-size:10.5px;letter-spacing:2px;color:var(--accent);direction:ltr;text-align:right;display:flex;gap:8px;align-items:center;justify-content:flex-end}
.eyebrow i{flex:0 0 26px;height:1px;background:currentColor;opacity:.5}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.35}
h1{font-size:26px;font-weight:800}h2{font-size:19px;font-weight:800}h3{font-size:16px;font-weight:700}
@media (max-width:900px){h1{font-size:22px}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--panel3);color:var(--dim);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:var(--panel2);color:var(--dim);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .n{font-family:var(--f-mono);font-size:11.5px;opacity:.8;margin-inline-start:6px}
.grid{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.empty{padding:30px 16px;text-align:center;color:var(--dim)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.err{color:var(--bad);font-size:13px;min-height:0}
.field{margin-bottom:12px;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:0 12px}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--panel2);cursor:pointer;margin-bottom:12px}
.tgl span{font-weight:600;font-size:14px}
.tgl input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:99px;background:var(--panel3);border:1px solid var(--line2);position:relative;flex:none;padding:0;cursor:pointer;transition:background .2s}
.tgl input::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl input:checked{background:var(--accent);border-color:var(--accent)}
.tgl input:checked::after{transform:translateX(-18px)}
html[dir="ltr"] .tgl input:checked::after{transform:translateX(18px)}
/* toast */
#toasts{position:fixed;top:calc(12px + var(--sat));left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--panel3);border:1px solid var(--line2);color:var(--ink);padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);font-weight:600;animation:tin .25s ease;pointer-events:auto}
.toast.bad{border-color:rgba(242,89,106,.5)}.toast.ok{border-color:rgba(60,207,130,.5)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
/* modal / sheet */
.modal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;animation:fin .18s ease}
@keyframes fin{from{opacity:0}}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:18px;width:min(560px,100%);max-height:min(88vh,860px);overflow:auto;padding:18px;box-shadow:var(--shadow);overscroll-behavior:contain}
.mbox.wide{width:min(860px,100%)}
.mhd{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.mhd .t{flex:1;min-width:0}
.x{width:38px;height:38px;border-radius:11px;border:1px solid var(--line2);background:var(--panel2);font-size:22px;line-height:1;cursor:pointer;flex:none;color:var(--ink)}
@media (max-width:640px){.modal{align-items:flex-end;padding:0}.mbox{width:100%;border-radius:20px 20px 0 0;max-height:92dvh;padding-bottom:calc(18px + var(--sab))}}
/* logo */
.blogo{width:42px;height:42px;border-radius:12px;object-fit:contain;flex:none;background:var(--panel2)}
.blogo.tx{display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));color:var(--accent-ink);font:800 20px var(--f-display)}
.bname{font-family:var(--f-display);font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit{font-size:12px;color:var(--faint);text-align:center;padding:16px}
.credit b{color:var(--dim)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ================= ADMIN SHELL ================= */
.adm{display:none}
body.m-admin .adm{display:block}
body.m-admin #store{display:none}
.side{position:fixed;top:0;bottom:0;right:0;width:var(--side);background:var(--panel);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;padding:16px 14px;gap:10px;z-index:40;padding-top:calc(16px + var(--sat))}
.side .brand{display:flex;align-items:center;gap:10px;padding:4px 4px 10px;border-bottom:1px solid var(--line)}
.side .brand small{display:block;font-size:11.5px;color:var(--dim)}
.side .cta{margin:6px 0}
.nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;color:var(--dim);text-decoration:none;font-weight:600;position:relative}
.nav a .ix{margin-inline-start:auto;font-family:var(--f-mono);font-size:11px;opacity:.6}
.nav a .bd{margin-inline-start:auto;background:var(--accent);color:var(--accent-ink);font:700 11px var(--f-mono);border-radius:99px;padding:1px 7px}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav a[aria-current="page"]::before{content:"";position:absolute;inset-inline-start:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
.nav a svg{width:19px;height:19px}
.side .me{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--f-display);background:var(--accent);color:var(--accent-ink);flex:none}
.side .me b{display:block;font-size:14px}.side .me small{color:var(--dim);font-size:12px}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);display:grid;place-items:center;cursor:pointer;position:relative;color:var(--ink);flex:none}
.ibtn svg{width:18px;height:18px}
.ibtn .bd{position:absolute;top:-5px;inset-inline-end:-5px;min-width:18px;height:18px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font:700 10.5px/18px var(--f-mono);text-align:center;padding:0 4px}
main.amain{margin-right:var(--side);padding:22px 26px 40px;max-width:calc(1240px + var(--side));min-height:100vh}
.mtop{display:none}
.bnav{display:none}
@media (max-width:900px){
  .side{display:none}
  main.amain{margin:0;padding:14px 16px calc(96px + var(--sab))}
  .mtop{display:flex;position:sticky;top:0;z-index:40;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 16px 10px;background:color-mix(in srgb,var(--void) 92%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
  .mtop .bname{font-size:16px;flex:1;min-width:0}
  .bnav{display:grid;grid-template-columns:repeat(2,1fr) 72px repeat(2,1fr);position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sab));height:calc(66px + var(--sab))}
  .bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--dim);text-decoration:none;font-size:11px;font-weight:600;position:relative;min-width:0}
  .bnav a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bnav a svg{width:21px;height:21px}
  .bnav a[aria-current="page"]{color:var(--accent)}
  .bnav a .bd{position:absolute;top:0;inset-inline-start:52%;background:var(--accent);color:var(--accent-ink);font:700 10px/16px var(--f-mono);border-radius:99px;padding:0 5px}
  .bnav .mid{position:relative}
  .bnav .mid i{position:absolute;top:-22px;left:50%;width:56px;height:56px;margin-left:-28px;border-radius:16px;transform:rotate(45deg);background:var(--accent);box-shadow:0 10px 26px -8px rgba(var(--acc-rgb),.9);display:grid;place-items:center}
  .bnav .mid i svg{transform:rotate(-45deg);color:var(--accent-ink);width:24px;height:24px}
  .bnav .mid span{margin-top:30px}
}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.phead .eyebrow{justify-content:flex-start;direction:ltr;text-align:left}
.view{animation:vin .35s ease}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:12px;margin-bottom:14px}
.stat .lb{font-size:13px;color:var(--dim);font-weight:600}
.stat .v{font:800 26px var(--f-display);margin-top:4px}
.stat .v small{font-size:13px;color:var(--dim);font-weight:600;margin-inline-start:4px}
.stat .s{font-size:12px;color:var(--faint)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:14px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .b{flex:1;min-width:0}
.li .b b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.li .b small{display:block;color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--panel3);flex:none;display:grid;place-items:center;color:var(--faint);font:800 16px var(--f-display)}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:10px}
.bars i{flex:1;background:linear-gradient(180deg,var(--accent),rgba(var(--acc-rgb),.35));border-radius:5px 5px 2px 2px;min-height:3px;transform-origin:bottom;animation:grow .6s ease}
@keyframes grow{from{transform:scaleY(0)}}
.barl{display:flex;gap:4px;font-size:10px;color:var(--faint)}.barl span{flex:1;text-align:center;font-family:var(--f-mono)}
/* products */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (min-width:700px){.pgrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,border-color .2s;text-align:start;padding:0;color:var(--ink)}
.pcard:hover{border-color:rgba(var(--acc-rgb),.4)}
.pcard:active{transform:scale(.98)}
.pcard .im{aspect-ratio:1;background:var(--panel2);display:grid;place-items:center;color:var(--faint);font:800 34px var(--f-display);position:relative;overflow:hidden}
.pcard .im img{width:100%;height:100%;object-fit:cover}
.pcard .im .pill{position:absolute;top:8px;inset-inline-start:8px}
.pcard .pb{padding:10px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.pcard .pb b{font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pb small{color:var(--dim);font-size:12px}
.pcard .pr{font:800 16px var(--f-display);color:var(--accent);margin-top:auto}
/* tables */
.tbox{overflow:auto;border:1px solid var(--line);border-radius:12px}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
table.t th,table.t td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
table.t th{font-size:12px;color:var(--dim);font-weight:700;background:var(--panel2);position:sticky;top:0}
/* POS */
.pos{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
.pos .cartc{position:sticky;top:16px}
.pos>*,.two>*,.stats>*,.grid>*{min-width:0}
@media (max-width:1100px){.pos{grid-template-columns:1fr}.pos .cartc{position:static}}
.cl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.cl .b{flex:1;min-width:0}.cl .b b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cl .b small{color:var(--dim);font-size:12px}
.qty{display:flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;flex:none}
.qty button{width:32px;height:32px;border:0;background:var(--panel2);cursor:pointer;font-size:18px;color:var(--ink)}
.qty span{min-width:30px;text-align:center;font:700 14px var(--f-mono)}
.tot{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}
.tot.big{font:800 22px var(--f-display);border-top:1px dashed var(--line2);padding-top:10px;margin-top:4px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:8px;font-weight:700;font-size:13.5px;color:var(--dim);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* product editor */
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.imgs .ti{width:78px;height:78px;border-radius:12px;overflow:hidden;position:relative;background:var(--panel2);border:1px solid var(--line2)}
.imgs .ti img{width:100%;height:100%;object-fit:cover}
.imgs .ti button{position:absolute;top:3px;inset-inline-end:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.imgs .ti.add{display:grid;place-items:center;border-style:dashed;cursor:pointer;color:var(--accent);font-size:28px}
.optg{border:1px solid var(--line2);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--panel2)}
.vtbl input{padding:7px 9px;font-size:14px}
.vtbl td{padding:5px 6px!important}
/* orders */
.ocard{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:8px}
.ocard.new{border-color:rgba(var(--acc-rgb),.5);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.08)}
.ocard .oh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ocard .oi{font-size:13.5px;color:var(--dim)}
/* gates */
.gate{min-height:100vh;display:grid;place-items:center;padding:calc(24px + var(--sat)) 16px 24px}
.gcard{width:min(420px,100%);display:flex;flex-direction:column;gap:14px}

async function finishSale(){
  const tot=cartTot();if(!CART.lines.length)return;
  if(CART.pay==="آجل"&&!CART.cust)return toast("البيع بالآجل يحتاج تختار الزبون","bad");
  for(const l of CART.lines){const p=S.products.find(x=>x.id===l.pid);if(!p||l.qty>stockOf(p,l.vk))return toast("الكمية مو كافية: "+l.name,"bad")}
  const paid=CART.pay==="آجل"?Math.min(tot,N(CART.paid)):tot;
  const sale={no:saleNo(),items:CART.lines.map(l=>({pid:l.pid,vk:l.vk,name:l.name,qty:l.qty,price:N(l.price),cost:N(l.cost)})),sub:cartSub(),disc:N(CART.disc),total:tot,paid,pay:CART.pay,cust:CART.cust?{id:CART.cust.id,name:CART.cust.name,phone:CART.cust.phone||""}:null,by:CUR.name,byId:CUR.id,at:Date.now(),src:"pos",whole:CART.whole};
  const btn=$("#cDone");if(btn)btn.disabled=true;
  try{const bt=FS.batch();const ref=T("sales").doc();bt.set(ref,sale);stockApply(sale.items.map(i=>({pid:i.pid,vk:i.vk,d:-i.qty})),bt);await bt.commit();
    beep("cash");CART.lines=[];CART.disc=0;CART.cust=null;CART.pay="نقد";CART.paid=null;render();receipt({id:ref.id,...sale})}
  catch(e){toast("ما انحفظ البيع: "+(e.code||"خطأ"),"bad");if(btn)btn.disabled=false}
}
function receiptText(s){return `${BR.name}\nفاتورة ${s.no} · ${fdt(s.at)}\n`+s.items.map(i=>`• ${i.name} × ${i.qty} = ${fmt(i.qty*i.price)}`).join("\n")+(s.disc?`\nخصم: ${fmt(s.disc)}`:"")+`\nالإجمالي: ${fmt(s.total)} د.ع\n`+(s.total-s.paid>0?`الواصل: ${fmt(s.paid)} · الباقي دين: ${fmt(s.total-s.paid)}\n`:"")+"شكراً لتعاملكم 🌷"}
function receipt(s){if(!s)return;const t=receiptText(s);const ph2=s.cust&&s.cust.phone?String(s.cust.phone).replace(/\D/g,"").replace(/^0/,"964"):"";
  const b=modal(MH("✅ فاتورة "+esc(s.no),fdt(s.at)+" · "+esc(s.by||""))+`<div class="list">${s.items.map(i=>`<div class="li"><div class="b"><b>${esc(i.name)}</b><small class="num">${i.qty} × ${fmt(i.price)}</small></div><b class="num">${fmt(i.qty*i.price)}</b></div>`).join("")}</div>
   ${s.disc?`<div class="tot"><span class="muted">خصم</span><span>${money(s.disc)}</span></div>`:""}<div class="tot big"><span>الإجمالي</span><span>${money(s.total)}</span></div>
   <div class="row" style="margin:6px 0 14px"><span class="pill">${esc(s.pay)}</span>${s.cust?`<span class="pill acc">${esc(s.cust.name)}</span>`:""}${s.total-s.paid>0?`<span class="pill warn">دين ${fmt(s.total-s.paid)}</span>`:""}${s.void?'<span class="pill bad">ملغية</span>':""}</div>
   <div class="row"><button class="btn ghost sp" id="rCp">${I.copy}نسخ</button>${ph2.length>=10?`<a class="btn wa sp" target="_blank" rel="noopener" href="https://wa.me/${ph2}?text=${encodeURIComponent(t)}">${I.wa}إرسال للزبون</a>`:""}</div>
   ${!s.void&&CUR.role==="owner"&&s.id?`<button class="btn bad block sm" id="rVoid" style="margin-top:10px">إلغاء الفاتورة وإرجاع المخزن</button>`:""}`);
  b.querySelector("#rCp").onclick=()=>copyText(t);
  const v=b.querySelector("#rVoid");if(v)v.onclick=()=>confirmBox("إلغاء الفاتورة "+esc(s.no)+"؟ الكميات ترجع للمخزن.","ألغيها",async()=>{const bt=FS.batch();bt.update(T("sales").doc(s.id),{void:true,voidBy:CUR.name,voidAt:Date.now()});stockApply(s.items.map(i=>({pid:i.pid,vk:i.vk,d:+i.qty})),bt);await bt.commit();toast("انلغت الفاتورة")},true)}

    b.querySelectorAll("[data-ba]").forEach(x=>x.onclick=()=>add(S.products.find(p=>p.id===x.dataset.ba),x.dataset.bk||null))};
  q.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const r=findCode(q.value);if(r)add(r.p,r.vk)}};
  draw();
  b.querySelector("#buGo").onclick=async()=>{const L=lines.filter(l=>l.qty>0);if(!L.length)return b.querySelector("#buE").textContent="ضيف صنف واحد على الأقل";

async function orderStatus(o,to){if(!o)return;
  if(to==="done"){for(const i of o.items){const p=S.products.find(x=>x.id===i.pid);if(!p)return toast("منتج بالطلب انحذف: "+i.name,"bad");if(i.qty>stockOf(p,i.vk))return toast("الكمية بالمخزن ما تكفي: "+i.name,"bad")}
    const sale={no:saleNo(),items:o.items.map(i=>{const p=S.products.find(x=>x.id===i.pid);return {pid:i.pid,vk:i.vk||null,name:i.name+(i.vk?" ("+i.vk+")":""),qty:i.qty,price:N(i.price),cost:costOf(p,i.vk)}}),sub:o.items.reduce((a,i)=>a+i.qty*i.price,0),disc:0,total:o.items.reduce((a,i)=>a+i.qty*i.price,0),paid:o.items.reduce((a,i)=>a+i.qty*i.price,0),pay:"توصيل",cust:{id:"",name:o.customer,phone:o.phone},by:CUR.name,byId:CUR.id,at:Date.now(),src:"store",order:o.id};
    const bt=FS.batch();const ref=T("sales").doc();bt.set(ref,sale);bt.update(T("orders").doc(o.id),{status:"done",sale:ref.id,doneAt:Date.now(),by:CUR.name});stockApply(sale.items.map(i=>({pid:i.pid,vk:i.vk,d:-i.qty})),bt);
    try{await bt.commit();beep("cash");toast("تم التسليم وانسجل كبيع ✓","ok")}catch(e){toast("ما انحفظ: "+(e.code||"خطأ"),"bad")}return}
  if(to==="cancel")return confirmBox("إلغاء الطلب #"+esc(o.no||o.id)+"؟","ألغي الطلب",async()=>{await T("orders").doc(o.id).update({status:"cancel",by:CUR.name,at2:Date.now()});toast("انلغى الطلب")},true);
  try{await T("orders").doc(o.id).update({status:to,by:CUR.name});toast(OST[to][0])}catch(e){toast("ما انحفظ","bad")}}

  b.querySelector("#chF").onsubmit=async e=>{e.preventDefault();const tx2=ta.value.trim();if(!tx2||send.disabled)return;send.disabled=true;const now=Date.now(),M=meta();ta.value="";grow();
    const mine={t:tx2,by:isAdm?"m":me,at:now,name:CUR?CUR.name:""};MSG.push(mine);ld=true;draw();
    try{if(isAdm){await ref.collection("msgs").doc().set({t:tx2,by:"m",at:now,who:(CUR?CUR.name+" · ":"")+BR.name});await ref.set({name:BR.name,last:tx2.slice(0,140),lastAt:now,lastBy:"m",unA:(M.lastBy==="m"?(+M.unA||0):0)+1,readM:now,unM:0},{merge:true})}
      else{await ref.collection("msgs").doc().set({t:tx2,by:me,at:now,name:CUR.name});await ref.set({last:tx2.slice(0,140),lastAt:now,lastBy:me,byName:CUR.name,read:{[me]:now}},{merge:true})}beep("send");ta.focus()}
    catch(x){MSG=MSG.filter(m=>m!==mine);draw();ta.value=tx2;grow();toast("ما وصلت الرسالة","bad")}};
  if(matchMedia("(pointer:fine)").matches)setTimeout(()=>ta.focus(),60)}
/* ================= boot ================= */
brandApply();
if(/^#admin/.test(location.hash)){adminBoot()}else{storeBoot()}
/* admin entry from the store: long-press logo or footer link */
(()=>{let n=0,t=0;document.addEventListener("click",e=>{if(!e.target.closest("#sLogo,#sName"))return;const now=Date.now();n=now-t<700?n+1:1;t=now;if(n>=5){n=0;location.hash="admin";location.reload()}})})();
/* new version check (works even from the home screen) */
setInterval(async()=>{if(document.hidden||!/^https:/.test(location.protocol))return;try{const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"});const t=await r.text();const m=t.match(/name="gs-build" content="(\d+)"/);if(m&&+m[1]>BUILD&&!$("#mdl")&&!$("#chW"))location.reload()}catch(e){}},60000);
if("serviceWorker" in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
