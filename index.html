<body>
<title>علي فيجن</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Orbitron:wght@800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: glass top bar + mobile dock · cinematic hero carousel · quick-add strip · section tiles · horizontal shelves · library grid · watch stage with ambilight + up-next rail. Dark-first, own light mode via [data-mode]. */
:root{
  --bg:#07070b; --bg2:#0c0c12; --card:#121219; --card2:#1a1a23; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --fg:#f6f3f5; --dim:#a39fa9; --mute:#67636e; --glass:rgba(10,10,16,.72); --shade:rgba(0,0,0,.55);
  --accent:#e3172b; --accent-ink:#fff; --ok:#2fd27a; --warn:#ffb020;
  --glow:.6; --r:16px; --rs:10px; --card-w:clamp(220px,23vw,300px);
  --f-ar:"Readex Pro",Tahoma,"Segoe UI",sans-serif; --f-hud:"Chakra Petch","Readex Pro",ui-monospace,monospace;
  color-scheme:dark;
}
:root[data-mode="light"]{--bg:#f3f2f6;--bg2:#e9e7ee;--card:#ffffff;--card2:#f1eff5;--line:rgba(15,10,30,.08);--line2:rgba(15,10,30,.16);--fg:#121118;--dim:#5b5765;--mute:#8e8998;--glass:rgba(250,249,252,.8);--shade:rgba(0,0,0,.35);color-scheme:light}
:root[data-corners="sharp"]{--r:4px;--rs:2px}
*{box-sizing:border-box}
html,body{direction:rtl;background:var(--bg);color:var(--fg)}
html{overflow-x:clip}
body{font-family:var(--f-ar);font-size:15px;line-height:1.6;min-height:100vh;overflow-x:hidden;margin:0;padding-block:0 110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hud{font-family:var(--f-hud);letter-spacing:.1em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;position:relative;z-index:1}
svg{flex:none}

/* ---------- ambient background ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:calc(.35 + var(--glow)*.6)}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.28;mix-blend-mode:screen;animation:drift 26s ease-in-out infinite alternate}
:root[data-mode="light"] .aurora i{mix-blend-mode:multiply;opacity:.14}
.aurora i:nth-child(1){background:var(--accent);top:-25vmax;right:-15vmax}
.aurora i:nth-child(2){background:color-mix(in srgb,var(--accent) 40%,#5a2bff);bottom:-30vmax;left:-20vmax;animation-duration:32s}
.aurora i:nth-child(3){background:color-mix(in srgb,var(--accent) 50%,#ff9a1a);top:30%;left:35%;width:30vmax;height:30vmax;animation-duration:22s;opacity:.16}
@keyframes drift{to{transform:translate(6vmax,5vmax) scale(1.15)}}
.aurora.off{display:none}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:14px;height:66px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;flex:none;background:none;border:0;padding:0}
.logo{width:40px;height:40px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);border-radius:12px;box-shadow:0 6px 24px -6px color-mix(in srgb,var(--accent) calc(var(--glow)*100%),transparent);position:relative;overflow:hidden}
:root[data-corners="sharp"] .logo{border-radius:2px;clip-path:polygon(25% 0,100% 0,100% 75%,75% 100%,0 100%,0 25%)}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 55%)}
.logo svg{width:20px;height:20px;margin-inline-start:-2px}
.brand b{display:block;font-size:18px;font-weight:700;line-height:1.1}
.brand small{display:block;font-family:var(--f-hud);font-size:9.5px;letter-spacing:.32em;color:var(--dim)}
.nav{display:flex;gap:4px;margin-inline-start:12px}
.nav a{padding:8px 14px;border-radius:999px;color:var(--dim);text-decoration:none;font-weight:500;transition:.2s}
.nav a:hover{color:var(--fg)}
.nav a.on{color:var(--fg);background:var(--card2)}
.sbox{flex:1;max-width:420px;margin-inline-start:auto;display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;background:var(--card);border:1px solid var(--line2);border-radius:999px;color:var(--dim);transition:.2s;text-align:start}
.sbox:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--line2))}
.sbox span:not(.kbd){flex:1}
.kbd{font-family:var(--f-hud);font-size:10px;border:1px solid var(--line2);border-radius:6px;padding:1px 6px;color:var(--mute)}
.btn{height:42px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--fg);font-weight:500;white-space:nowrap;transition:.2s;text-decoration:none}
.btn:hover{border-color:var(--fg)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 8px 28px -10px color-mix(in srgb,var(--accent) calc(var(--glow)*120%),transparent)}
.btn.pri:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.ghost{background:transparent}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.btn.ic{width:42px;padding:0}
.btn.on{border-color:var(--accent);color:var(--accent)}
:root[data-corners="sharp"] .btn,:root[data-corners="sharp"] .sbox,:root[data-corners="sharp"] .nav a{border-radius:2px}
.cloud{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.cloud i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.cloud.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.cloud.err i{background:var(--warn)}
@media (max-width:900px){.nav,.top .addb .t,.sbox .kbd,.cloud .t{display:none}.sbox{max-width:none}}
@media (max-width:620px){.sbox,.top .addb,.top .setb{display:none}.top .cloud{margin-inline-start:auto}}

/* ---------- mobile dock ---------- */
.dock{display:none;position:fixed;z-index:65;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line2);border-radius:24px;padding:6px;gap:2px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.dock a,.dock button{width:58px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:var(--dim);font-size:10.5px;text-decoration:none;border-radius:16px}
.dock a.on{color:var(--fg);background:var(--card2)}
.dock svg{width:21px;height:21px}
.dock .fab{width:54px;height:54px;margin:0 4px;background:var(--accent);color:var(--accent-ink);border-radius:18px;box-shadow:0 8px 24px -6px var(--accent)}
.dock .fab svg{width:26px;height:26px}
@media (max-width:620px){.dock{display:flex}}

/* ---------- views ---------- */
.view{animation:vin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}

/* hero */
.hero{position:relative;margin-top:20px;border-radius:calc(var(--r) + 8px);overflow:hidden;min-height:clamp(320px,44vw,500px);display:flex;align-items:flex-end;border:1px solid var(--line);isolation:isolate}
.hero .bd{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;transform:scale(1.04);transition:opacity .6s}
.hero .bd .sig{position:absolute;inset:0}
.hero .bd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to left,rgba(4,4,8,.94) 0%,rgba(4,4,8,.75) 38%,rgba(4,4,8,.15) 75%),linear-gradient(0deg,rgba(4,4,8,.85),transparent 55%)}
.hero .hc{padding:clamp(22px,4vw,48px);max-width:620px;color:#fff;display:flex;flex-direction:column;gap:14px}
.pill{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--accent) 22%,rgba(0,0,0,.4));border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);color:#fff;backdrop-filter:blur(6px)}
.pill .live{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
.hero h1{margin:0;font-size:clamp(26px,4.2vw,50px);line-height:1.15;font-weight:700;text-wrap:balance;text-shadow:0 2px 30px rgba(0,0,0,.5)}
.hero .hm{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:rgba(255,255,255,.75);font-size:14px}
.hero .hn{color:rgba(255,255,255,.7);font-size:14.5px;max-width:52ch}
.hero .ha{display:flex;gap:10px;flex-wrap:wrap}
.hero .ha .btn:not(.pri){background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(8px)}
.hprog{height:4px;border-radius:4px;background:rgba(255,255,255,.18);max-width:340px;overflow:hidden}
.hprog i{display:block;height:100%;background:var(--accent)}
.hdots{position:absolute;bottom:18px;left:22px;display:flex;gap:6px}
.hdots button{width:8px;height:8px;border-radius:99px;border:0;background:rgba(255,255,255,.35);padding:0;transition:.3s}
.hdots button.on{width:26px;background:#fff}
.hthumb{position:absolute;left:clamp(22px,4vw,48px);top:50%;transform:translateY(-50%);width:min(40%,460px);aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.12);cursor:pointer;border:0;padding:0;background:#000}
.hthumb .pg{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.2);transition:.3s}
.hthumb:hover .pg{background:rgba(0,0,0,.05)}
@media (max-width:860px){.hthumb{display:none}.hero::before{background:linear-gradient(0deg,rgba(4,4,8,.95) 15%,rgba(4,4,8,.4) 70%,rgba(4,4,8,.2))}}
.playorb{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 25%,transparent),0 0 40px var(--accent)}
.playorb svg{width:26px;height:26px;margin-inline-start:-3px}

/* quick add */
.qadd{margin-top:18px;display:flex;gap:10px;align-items:center;padding:10px;background:var(--card);border:1px solid var(--line2);border-radius:calc(var(--r) + 4px);flex-wrap:wrap;position:relative;overflow:hidden}
.qadd::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 10%,transparent),transparent);pointer-events:none}
.qadd .qi{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;padding:0 8px}
.qadd .qi svg{width:22px;height:22px;color:var(--accent)}
.qadd input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15.5px;padding:10px 0;direction:ltr;text-align:right}
.qadd input::placeholder{direction:rtl}
.qadd select{height:42px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);padding:0 14px;max-width:180px}
.qprev{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ok);flex-basis:100%;padding:0 8px}
.qprev .t{width:80px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;position:relative;background:#000}
@media (max-width:620px){.qadd select{flex:1;max-width:none}.qadd .btn{flex:1}}

/* section heads */
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:34px 0 14px}
.sh h2{margin:0;font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px}
.sh h2 .dot{width:10px;height:10px;border-radius:3px;transform:rotate(45deg)}
.sh h2 small{font-family:var(--f-hud);font-size:12px;color:var(--mute);font-weight:500}
.sh .more{background:none;border:0;color:var(--dim);font-size:13.5px;display:inline-flex;align-items:center;gap:4px;padding:4px 0}
.sh .more:hover{color:var(--accent)}
.sh .arrows{display:flex;gap:6px}
.sh .arrows button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;color:var(--dim)}
.sh .arrows button:hover{color:var(--fg);border-color:var(--fg)}
@media (hover:none){.sh .arrows{display:none}}

/* section tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.tile{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card);text-align:start;padding:0;aspect-ratio:16/10;max-width:100%;isolation:isolate;transition:.25s}
.tile:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 14px 40px -16px var(--c)}
.tile .mos{position:absolute;inset:0;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;z-index:-2}
.tile .mos>div{position:relative;overflow:hidden;background:var(--card2)}
.tile .mos>div:first-child{grid-row:span 2}
.tile .mos img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,color-mix(in srgb,var(--c) 55%,rgba(0,0,0,.9)) 0%,rgba(0,0,0,.35) 60%,rgba(0,0,0,.1))}
.tile .tc{position:absolute;inset:auto 0 0 0;padding:14px;color:#fff;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.tile b{font-size:17px;line-height:1.3}
.tile .cnt{font-family:var(--f-hud);font-size:12px;opacity:.85}
.tile .ring{width:38px;height:38px;flex:none}
.tile.newt{display:grid;place-items:center;border-style:dashed;border-color:var(--line2);color:var(--dim);background:transparent}
.tile.newt::after{display:none}
.tile.newt span{display:flex;flex-direction:column;align-items:center;gap:6px}

/* shelves */
.row{display:grid;grid-auto-flow:column;grid-auto-columns:var(--card-w);gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 14px;scrollbar-width:none;overscroll-behavior-x:contain}
.row::-webkit-scrollbar{display:none}
.row>*{scroll-snap-align:start}

/* video card */
.vc{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0}
.vt{position:relative;display:block;aspect-ratio:16/9;max-width:100%;width:100%;border-radius:var(--r);overflow:hidden;background:#000;border:0;padding:0;cursor:pointer;isolation:isolate;box-shadow:0 0 0 1px var(--line)}
.vt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.vc:hover .vt img{transform:scale(1.06)}
.vt .ov{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent 55%);opacity:.0;transition:.25s}
.vc:hover .vt .ov,.vt:focus-visible .ov{opacity:1}
.vt .ov .playorb{width:52px;height:52px;transform:scale(.8);transition:.25s}
.vc:hover .vt .ov .playorb{transform:scale(1)}
.vt .ov .playorb svg{width:20px;height:20px}
.vc:hover .vt{box-shadow:0 0 0 2px var(--accent),0 18px 44px -16px color-mix(in srgb,var(--accent) calc(var(--glow)*100%),transparent)}
.vt .bar{position:absolute;inset:auto 0 0 0;height:4px;background:rgba(255,255,255,.2)}
.vt .bar i{display:block;height:100%;background:var(--accent)}
.bdg{position:absolute;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.72);color:#fff;backdrop-filter:blur(4px)}
.bdg.dur{bottom:9px;left:8px;font-family:var(--f-hud);letter-spacing:.05em}
.bdg.ex{bottom:9px;right:8px;color:var(--warn)}
.bdg.wd{top:8px;left:8px;color:var(--ok);display:flex;align-items:center;gap:4px}
.bdg.wd svg{width:12px;height:12px}
.vfav{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;opacity:0;transition:.2s;backdrop-filter:blur(4px)}
.vfav svg{width:16px;height:16px}
.vfav.on{opacity:1;color:var(--accent)}
.vc:hover .vfav{opacity:1}
@media (hover:none){.vfav{opacity:1}}
.vi{display:flex;gap:8px;align-items:flex-start;padding:0 2px}
.vi .tx{flex:1;min-width:0}
.vi .tt{font-weight:600;font-size:14.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.vi .mm{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
.vi .mm i{width:7px;height:7px;border-radius:2px;transform:rotate(45deg);display:inline-block}
.dots{width:32px;height:32px;flex:none;border-radius:50%;border:0;background:transparent;color:var(--dim);display:grid;place-items:center}
.dots:hover{background:var(--card2);color:var(--fg)}
.dots svg{width:18px;height:18px}

/* library */
.lhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:26px 0 14px}
.lhead h1{margin:0;font-size:clamp(24px,3vw,34px)}
.lhead p{margin:2px 0 0;color:var(--dim)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--dim);font-weight:500;transition:.2s;white-space:nowrap}
.chip:hover{color:var(--fg)}
.chip.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.chip .d{width:8px;height:8px;border-radius:2px;transform:rotate(45deg)}
.chip.on .d{background:currentColor!important}
.chip .n{font-family:var(--f-hud);font-size:11px;opacity:.75}
:root[data-corners="sharp"] .chip{border-radius:2px}
.ltools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sel{height:38px;border-radius:999px;border:1px solid var(--line2);background:var(--card);padding:0 12px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--dim);height:30px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.seg button.on{background:var(--card2);color:var(--fg)}
.seg svg{width:16px;height:16px}
:root[data-corners="sharp"] .seg,:root[data-corners="sharp"] .seg button,:root[data-corners="sharp"] .sel{border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--gw,260px)),1fr));gap:22px 16px;margin-top:6px}
.grid.list{grid-template-columns:1fr;gap:10px}
.grid.list .vc{flex-direction:row;align-items:center;gap:14px;padding:8px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.grid.list .vt{width:200px;flex:none}
.grid.list .vi{flex:1}
@media (max-width:560px){.grid.list .vt{width:128px}}
.empty{grid-column:1/-1;text-align:center;padding:56px 20px;border:1px dashed var(--line2);border-radius:var(--r);color:var(--dim)}
.empty .eo{width:64px;height:64px;margin:0 auto 12px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.empty .eo svg{width:30px;height:30px}
.empty b{display:block;color:var(--fg);font-size:18px;margin-bottom:4px}

/* fallback signal thumb */
.sig{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;overflow:hidden}
.sig .wave{width:70%;height:30px}
.sig .id{font-family:var(--f-hud);font-size:11px;letter-spacing:.2em;opacity:.7}

/* ---------- watch ---------- */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;margin-top:20px;align-items:start}
@media (max-width:1060px){.watch{grid-template-columns:1fr}}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--dim);background:none;border:0;padding:6px 0;margin-top:14px;font-size:14px}
.back:hover{color:var(--fg)}
.stage{position:relative;isolation:isolate}
.ambi{position:absolute;inset:-6%;z-index:-1;filter:blur(60px) saturate(1.6);opacity:calc(.25 + var(--glow)*.55);border-radius:40px;overflow:hidden;transition:opacity .6s}
.ambi img,.ambi .sig{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.player{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:var(--r);overflow:hidden;box-shadow:0 30px 80px -30px rgba(0,0,0,.9),0 0 0 1px var(--line2)}
.player iframe,.player #ytp{position:absolute;inset:0;width:100%;height:100%;border:0}
.pmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;color:#fff;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--accent) 30%,#000),#000 72%)}
.pmsg b{font-size:clamp(16px,2vw,20px)}
.pmsg p{margin:0;max-width:48ch;color:rgba(255,255,255,.7);font-size:14px}
.nextup{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);z-index:3;color:#fff}
.nextup .nb{display:flex;gap:18px;align-items:center;max-width:90%;flex-wrap:wrap;justify-content:center}
.nextup .nt{width:220px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;position:relative;background:#000}
.nextup .cd{font-family:var(--f-hud);font-size:48px;font-weight:700;color:var(--accent);line-height:1}
.cine-on .top,.cine-on .dock,.cine-on .wside,.cine-on .wbelow,.cine-on .back{opacity:.08;transition:opacity .4s}
.cine-on .top:hover,.cine-on .wside:hover{opacity:1}
.cine-on .ambi{opacity:1}
.wtitle{margin:20px 0 6px;font-size:clamp(20px,2.4vw,28px);line-height:1.35;text-wrap:balance}
.wmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--dim);font-size:13.5px}
.wmeta .tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--card2);color:var(--fg);font-size:13px}
.wmeta .tag i{width:7px;height:7px;border-radius:2px;transform:rotate(45deg)}
.wacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ctrl{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.ctrl .lbl{font-size:12px;color:var(--dim);margin-inline-end:2px}
.ctrl .sp{flex:1}
.tg{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--dim);font-size:13px}
.tg svg{width:16px;height:16px}
.tg.on{color:var(--fg);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
:root[data-corners="sharp"] .tg{border-radius:2px}
.wbelow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media (max-width:700px){.wbelow{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box h3{margin:0;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.box textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line2);border-radius:var(--rs);background:var(--bg2);padding:10px;outline:none}
.box textarea:focus{border-color:var(--accent)}
.bm{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--rs);background:var(--bg2);border:1px solid transparent;text-align:start;width:100%;color:var(--fg)}
.bm:hover{border-color:var(--accent)}
.bm .t{font-family:var(--f-hud);color:var(--accent);font-size:13px;min-width:48px}
.bm .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.bm .x{width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:var(--mute);display:grid;place-items:center}
.bm .x:hover{color:var(--accent)}
.muted{color:var(--mute);font-size:13px}
.wside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-height:calc(100vh - 110px);display:flex;flex-direction:column}
@media (max-width:1060px){.wside{position:static;max-height:none}}
.wside .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.wside .hd b{font-size:15px}
.wside .hd small{display:block;color:var(--dim);font-size:12px}
.qlist{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
.qit{display:flex;gap:10px;align-items:center;padding:6px;border-radius:var(--rs);border:0;background:transparent;text-align:start;color:var(--fg);width:100%}
.qit:hover{background:var(--card2)}
.qit.now{background:color-mix(in srgb,var(--accent) 14%,var(--card2))}
.qit .n{width:20px;text-align:center;font-family:var(--f-hud);font-size:12px;color:var(--mute);flex:none}
.qit.now .n{color:var(--accent)}
.qit .th{width:120px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;position:relative;flex:none;background:#000}
.qit .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.qit .th .bar{position:absolute;inset:auto 0 0 0;height:3px;background:rgba(255,255,255,.2)}
.qit .th .bar i{display:block;height:100%;background:var(--accent)}
.qit .tx{flex:1;min-width:0}
.qit .tx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;font-weight:500;line-height:1.4}
.qit .tx small{color:var(--dim);font-size:12px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.eq i{width:3px;background:var(--accent);animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:90;background:rgba(3,3,6,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.panel{background:var(--card);border:1px solid var(--line2);border-radius:calc(var(--r) + 6px);width:min(560px,100%);max-height:100%;overflow:auto;animation:rise .3s cubic-bezier(.2,.9,.3,1.15);box-shadow:0 40px 100px -30px rgba(0,0,0,.8)}
@keyframes rise{from{transform:translateY(18px) scale(.97);opacity:0}}
.ph{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
.ph h4{margin:0;font-size:19px}
.pb{padding:12px 20px 18px;display:flex;flex-direction:column;gap:14px}
.pf{display:flex;gap:8px;padding:14px 20px 20px;flex-wrap:wrap}
.xb{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:transparent;display:grid;place-items:center;color:var(--fg)}
.xb svg{width:18px;height:18px}
.xb:hover{border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--dim)}
.in{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--rs);padding:11px 13px;color:var(--fg);outline:none;transition:.2s}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.in.ltr{direction:ltr;text-align:left}
textarea.in{min-height:96px;resize:vertical}
.det{display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--rs);border:1px solid var(--line);background:var(--bg2);font-size:13px;min-height:58px}
.det .pv{width:110px;aspect-ratio:16/9;position:relative;flex:none;overflow:hidden;border-radius:8px;background:#000}
.det .pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ok{color:var(--ok)}.bad{color:var(--accent)}
.menu{position:fixed;z-index:95;min-width:200px;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:6px;box-shadow:0 20px 60px -10px rgba(0,0,0,.7);animation:rise .18s}
.menu button,.menu a{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;background:transparent;border-radius:10px;color:var(--fg);text-align:start;font-size:14px;text-decoration:none}
.menu button:hover,.menu a:hover{background:var(--card2)}
.menu svg{width:17px;height:17px;color:var(--dim)}
.menu .danger{color:var(--accent)}.menu .danger svg{color:var(--accent)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* palette */
.pal{width:min(640px,100%);align-self:flex-start;margin-top:8vh;overflow:hidden}
.pal .pi{display:flex;align-items:center;gap:10px;padding:6px 18px;border-bottom:1px solid var(--line)}
.pal .pi svg{width:20px;height:20px;color:var(--dim)}
.pal input{flex:1;border:0;background:transparent;outline:none;font-size:17px;padding:14px 0}
.pres{max-height:56vh;overflow:auto;padding:8px}
.pr{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;background:transparent;border:0;border-radius:12px;text-align:start;color:var(--fg)}
.pr.sel,.pr:hover{background:var(--card2)}
.pr .pt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .ps{font-size:12px;color:var(--dim)}
.pr .tn{width:72px;aspect-ratio:16/9;position:relative;flex:none;overflow:hidden;border-radius:8px;background:#000}
.pr .tn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pr .ic{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--bg2);flex:none}
.pr .ic svg{width:17px;height:17px}
.pgrp{font-size:11px;color:var(--mute);padding:8px 10px 4px;font-family:var(--f-hud);letter-spacing:.18em}

/* settings drawer */
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(440px,100%);z-index:92;background:var(--card);border-right:1px solid var(--line2);overflow:auto;padding:env(safe-area-inset-top,0px) 0 calc(env(safe-area-inset-bottom,0px) + 24px) env(safe-area-inset-left,0px);animation:slide .32s cubic-bezier(.2,.8,.2,1);box-shadow:30px 0 80px rgba(0,0,0,.5)}
@keyframes slide{from{transform:translateX(-100%)}}
.dh{position:sticky;top:0;z-index:2;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h4{margin:0;font-size:19px}
.grp{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.grp h5{margin:0;font-family:var(--f-hud);font-size:11px;letter-spacing:.24em;color:var(--accent)}
.grp p{margin:0;font-size:13px;color:var(--dim)}
.sws{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:38px;height:38px;border-radius:12px;border:2px solid transparent;position:relative}
.sw.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--fg)}
input[type=color]{width:42px;height:38px;border:1px solid var(--line2);border-radius:12px;background:transparent;padding:3px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.srow>span{font-size:14px}
.tog{width:48px;height:28px;flex:none;border-radius:99px;background:var(--card2);border:1px solid var(--line2);position:relative;transition:.2s}
.tog::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:.2s}
.tog[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.tog[aria-checked="true"]::after{right:23px;background:#fff}
input[type=range]{width:100%;accent-color:var(--accent)}
.secrow{display:flex;align-items:center;gap:8px}
.secrow .in{padding:8px 10px}
.secrow input[type=color]{width:38px;flex:none}
.status{display:flex;align-items:center;gap:8px;font-size:13px;padding:10px 12px;border-radius:var(--rs);background:var(--bg2)}
.status i{width:9px;height:9px;border-radius:50%;background:var(--mute);flex:none}
.status.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.status.err i{background:var(--warn)}

/* toast */
.toasts{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px);pointer-events:none}
@media (min-width:621px){.toasts{bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}}
.toast{background:var(--card2);border:1px solid var(--line2);border-radius:999px;padding:10px 18px;font-size:14px;animation:rise .25s;box-shadow:0 14px 40px rgba(0,0,0,.5);display:flex;align-items:center;gap:8px}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}

/* boot */
#boot{position:fixed;inset:0;z-index:200;background:#050508;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;transition:opacity .6s,visibility .6s}
#boot.gone{opacity:0;visibility:hidden}
#boot .bl{width:92px;height:92px;border-radius:28px;display:grid;place-items:center;background:var(--accent);color:#fff;box-shadow:0 0 0 14px color-mix(in srgb,var(--accent) 18%,transparent),0 0 80px var(--accent);animation:bpop .9s cubic-bezier(.2,1.4,.3,1)}
#boot .bl svg{width:40px;height:40px;margin-inline-start:-4px}
@keyframes bpop{from{transform:scale(.4) rotate(-20deg);opacity:0}}
#boot .bn{font-family:var(--f-hud);font-size:22px;letter-spacing:.5em;color:#fff;animation:fade 1s .2s both;direction:ltr}
#boot .bc{font-size:13px;color:#8f8a98;animation:fade 1s .5s both}
#boot .bc b{color:#fff}
#boot .bb{width:180px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#boot .bb i{display:block;height:100%;width:0;background:var(--accent);animation:load 1.3s .2s forwards cubic-bezier(.6,0,.2,1)}
@keyframes load{to{width:100%}}
.foot{margin:56px 0 0;text-align:center;color:var(--mute);font-size:12.5px}
.foot b{color:var(--dim)}
:root[data-motion="off"] *,:root[data-motion="off"] *::before,:root[data-motion="off"] *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* =====================================================================
   ALI MALIK STYLE LAYER — calm sci-fi HUD (same family as AM NET / Dazzaz)
   ===================================================================== */
:root{
  --bg:#0b0c10;--bg2:#0f1015;--card:#121319;--card2:#1a1c24;--line:rgba(255,255,255,.065);--line2:rgba(255,255,255,.11);
  --fg:#eceef2;--dim:#99a0ab;--mute:#5d636e;--glass:rgba(11,12,16,.86);--ok:#3ccf82;--warn:#f2b03d;
  --r:14px;--rs:10px;--acc-rgb:227,23,43;--side:262px;--bnav:66px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --f-ar:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-display:"Cairo","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-tech:"Orbitron","JetBrains Mono",ui-monospace,monospace;
  --f-hud:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
:root[data-mode="light"]{--bg:#f3f4f7;--bg2:#eceef2;--card:#ffffff;--card2:#f6f7f9;--line:rgba(16,22,34,.08);--line2:rgba(16,22,34,.14);
  --fg:#161a22;--dim:#5b6270;--mute:#959ba6;--glass:rgba(255,255,255,.88);--ok:#17925a;--warn:#b4760f}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
a,button,input,select,label{-webkit-tap-highlight-color:transparent}
body{line-height:1.65;-webkit-font-smoothing:antialiased;padding-block:0 120px;
  background-image:radial-gradient(1000px 520px at 75% -20%,rgba(var(--acc-rgb),.07),transparent 60%),var(--bgpat,none);background-size:auto,160px 160px;background-attachment:fixed}
body::before{height:var(--sat);background:var(--bg)}
h1,h2,h3,h4,.brand b,.tile b,.wtitle{font-family:var(--f-display)}
.hud{font-family:var(--f-tech);letter-spacing:.12em}
.grp h5,.pgrp{font-family:var(--f-ar)!important;letter-spacing:.02em!important;font-weight:700}
.tile .cnt{font-family:var(--f-ar)!important}
.chip .n,.qit .n,.sclock b{font-family:var(--f-hud)}
.aurora{opacity:calc(.2 + var(--glow)*.4)}

/* logo */
.logo{width:44px;height:44px;background:none!important;box-shadow:none!important;border-radius:0!important;clip-path:none!important;overflow:visible}
.logo::after{display:none}
.logo svg{width:44px!important;height:44px!important;margin:0!important;filter:drop-shadow(0 0 8px rgba(var(--acc-rgb),.35))}
.brand b{font-weight:800;font-size:18px}
.brand small{font-family:var(--f-tech);letter-spacing:.3em;font-size:9px}

/* eyebrow */
.eyebrow{font-family:var(--f-tech);font-size:9.5px;letter-spacing:2px;color:var(--accent);direction:ltr;display:flex;gap:10px;align-items:center;justify-content:flex-end;opacity:.8;margin-bottom:2px}
.eyebrow::before{content:"";width:20px;height:1px;background:var(--line2);order:2}
.eyebrow b{order:3;color:var(--dim);font-weight:600}
.eyebrow span{order:1}

/* HUD corner brackets on panels */
.box,.wside,.qadd,.lhead,.ctrl{--hc:rgba(var(--acc-rgb),.55);background-image:
  linear-gradient(var(--hc),var(--hc)),linear-gradient(var(--hc),var(--hc)),linear-gradient(var(--hc),var(--hc)),linear-gradient(var(--hc),var(--hc));
  background-repeat:no-repeat;background-size:12px 1.5px,1.5px 12px,12px 1.5px,1.5px 12px;background-position:left top,left top,right bottom,right bottom}
.lhead{padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background-color:var(--card)}
.box,.wside,.qadd,.ctrl{background-color:var(--card)}

/* buttons, inputs, chips */
.btn{border-radius:var(--rs);font-weight:600}
.btn.sm{border-radius:8px}
.btn.pri{box-shadow:0 8px 22px -12px rgba(var(--acc-rgb),.7)}
.sbox,.sel,.seg,.qadd select{border-radius:var(--rs)}
.seg button{border-radius:8px}
.in{border-radius:var(--rs)}
.in:focus,.sbox:focus-visible{box-shadow:0 0 0 3px rgba(var(--acc-rgb),.16)}
.chip{border-radius:999px;background:transparent}
.chip.on{background:rgba(var(--acc-rgb),.14);color:var(--fg);border-color:rgba(var(--acc-rgb),.6)}
.chip.on .d{background:var(--accent)!important}
.qadd{border-radius:var(--r)}
.qadd::before{opacity:.6}
.panel{border-radius:18px}
.toast{border-radius:12px;border-color:rgba(var(--acc-rgb),.45)}

/* section heads */
.sh h2{font-size:19px;font-weight:800}
.sh h2 .dot{width:9px;height:9px;border-radius:2px}
.lhead h1{font-size:clamp(22px,2.6vw,28px);font-weight:800}
.wtitle{font-weight:800}

/* video cards: calmer hover */
.vt{border-radius:var(--r)}
.vc:hover .vt{box-shadow:0 0 0 1.5px rgba(var(--acc-rgb),.8),0 14px 34px -18px rgba(var(--acc-rgb),.6)}
.tile{border-radius:var(--r)}

/* ---------- toasts at the top ---------- */
.toasts{top:calc(var(--sat) + 12px);bottom:auto!important}
.toast{animation:toastIn .22s ease-out}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}}

/* ---------- desktop: right sidebar ---------- */
.navlbl,.sclock,.scredit{display:none}
@media (min-width:901px){
  body{padding-right:var(--side)}
  .top{position:fixed;top:0;bottom:0;right:0;width:var(--side);height:100vh;border-bottom:0;border-left:1px solid var(--line);background:color-mix(in srgb,var(--card) 92%,transparent);padding:max(20px,var(--sat)) 16px max(16px,var(--sab));overflow:auto}
  .top-in{flex-direction:column;align-items:stretch;height:auto;min-height:100%;gap:14px;max-width:none}
  .brand{order:0}
  .top .addb{order:1;height:50px;border-radius:0;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));font-size:15.5px;font-weight:700;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));box-shadow:none}
  .top .addb .t{display:inline!important}
  .sbox{order:2;flex:none!important;max-width:none;margin:0;border-radius:var(--rs);height:44px}
  .navlbl{order:3;display:block;font-size:11.5px;color:var(--mute);padding-inline:8px;margin-top:4px}
  .nav{order:4;flex-direction:column;gap:2px;margin:0}
  .nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--rs);font-weight:600;font-size:14.5px;position:relative}
  .nav a svg{width:19px;height:19px;flex:none}
  .nav a .ix{margin-inline-start:auto;font-family:var(--f-hud);font-size:11px;color:var(--mute);opacity:.7}
  .nav a.on{background:rgba(var(--acc-rgb),.12);color:var(--fg)}
  .nav a.on::before{content:"";position:absolute;inset-inline-start:-16px;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--accent);animation:sideBar .45s cubic-bezier(.2,.8,.2,1)}
  .nav a.on .ix{color:var(--accent);opacity:1}
  .sclock{order:6;margin-top:auto;display:flex;align-items:baseline;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:var(--rs);padding:12px 14px}
  .sclock b{font-size:21px;font-weight:700}
  .sclock span{font-family:var(--f-hud);font-size:10px;color:var(--dim);letter-spacing:1px;direction:ltr}
  .top .cloud{order:7;padding-inline:4px}
  .top .cloud .t{display:inline!important}
  .top .setb{order:8;width:100%;border-radius:var(--rs)}
  .top .setb::after{content:"الإعدادات";font-size:14px}
  .scredit{order:9;display:block;font-size:12px;color:var(--mute);text-align:center}
  .scredit b{color:var(--dim)}
  .sbox .kbd{display:inline!important}
  .wrap{max-width:1240px}
  .wside{top:16px;max-height:calc(100vh - 32px)}
  .drawer{z-index:95}
}
@keyframes sideBar{from{transform:scaleY(0)}}

/* ---------- phone: top bar + bottom nav with raised diamond ---------- */
@media (max-width:900px){
  .top{top:0;padding-top:var(--sat)}
  .top-in{height:60px;gap:10px}
  .nav,.top .addb{display:none!important}
  .sbox{display:flex!important;flex:none;width:42px;height:42px;padding:0;justify-content:center;margin-inline-start:auto;border-radius:var(--rs)}
  .sbox span{display:none}
  .top .setb{display:inline-flex!important;border-radius:var(--rs)}
  .top .cloud{margin:0}
  .brand small{display:none}
  .dock{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr)) 74px repeat(2,minmax(0,1fr));left:0;right:0;bottom:0;transform:none;border-radius:0;border:0;border-top:1px solid var(--line);height:calc(var(--bnav) + var(--sab));padding:0 env(safe-area-inset-right,0px) var(--sab) env(safe-area-inset-left,0px);background:var(--glass);gap:0}
  .dock a,.dock button{width:auto;height:var(--bnav);border-radius:0;font-size:10.5px;font-weight:600;color:var(--mute)}
  .dock a.on{background:none;color:var(--accent)}
  .dock a.on svg{animation:navPop .4s cubic-bezier(.2,.9,.3,1.4)}
  .dock .fab{order:0;justify-self:center;align-self:start;width:56px;height:56px;margin:-22px 0 0;border-radius:16px;transform:rotate(45deg);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));border:3px solid var(--bg);box-shadow:0 6px 20px rgba(var(--acc-rgb),.35)}
  .dock .fab svg{transform:rotate(-45deg);width:25px;height:25px}
  .dock a:nth-child(1){order:-2}.dock a:nth-child(2){order:-1}
  body{padding-bottom:calc(var(--bnav) + var(--sab) + 30px)}
  .wside{top:auto}
}
@keyframes navPop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:none}}

/* ---------- boot: calm animated logo ---------- */
#boot{background:var(--bg)!important;background-image:radial-gradient(700px 420px at 50% 0%,rgba(var(--acc-rgb),.16),transparent 65%),var(--bgpat,none)!important;background-size:auto,160px 160px!important;gap:18px}
#boot .bn{font-family:var(--f-tech);font-weight:900;font-size:26px;letter-spacing:.32em;color:var(--fg)}
#boot .bn em{font-style:normal;color:var(--accent)}
#boot .bc{color:var(--dim)}#boot .bc b{color:var(--fg)}
#boot .bb{background:var(--line2)}
.core{position:relative;width:150px;height:150px;display:grid;place-items:center}
.core .r{position:absolute;border-radius:50%;border:1.5px solid rgba(var(--acc-rgb),.5)}
.core .r1{inset:0;border-style:dashed;border-color:rgba(var(--acc-rgb),.35);animation:spin 16s linear infinite}
.core .r2{inset:14%;border-color:transparent;border-top-color:var(--accent);border-bottom-color:rgba(var(--acc-rgb),.5);animation:spin 3.2s linear infinite reverse;box-shadow:0 0 18px rgba(var(--acc-rgb),.22)}
.core .r3{inset:27%;border-color:rgba(var(--acc-rgb),.18);border-left-color:var(--accent);animation:spin 6s linear infinite}
.core .pulse{position:absolute;inset:32%;border-radius:50%;background:radial-gradient(circle,rgba(var(--acc-rgb),.42),transparent 70%);animation:corePulse 2.4s ease-in-out infinite}
.core svg{position:relative;width:46%;height:46%;filter:drop-shadow(0 0 12px rgba(var(--acc-rgb),.6))}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes corePulse{0%,100%{transform:scale(.85);opacity:.6}50%{transform:scale(1.15);opacity:1}}

/* ---------- page transitions ---------- */
.view.enter>*{animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.view.enter .lhead h1,.view.enter .wtitle{animation:hudType .6s steps(1) both}
@keyframes hudType{0%{opacity:0}15%{opacity:1}22%{opacity:.25}30%{opacity:1}40%{opacity:.6}48%,100%{opacity:1}}
#warp{position:fixed;inset:0;z-index:80;pointer-events:none;opacity:0}
#warp.go{animation:warpOn .7s ease-out}
#warp::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent) 30%,#fff 50%,var(--accent) 70%,transparent);box-shadow:0 0 16px var(--accent),0 0 46px rgba(var(--acc-rgb),.4)}
#warp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(var(--acc-rgb),.05) 0 1px,transparent 1px 4px)}
#warp.go::before{animation:warpScan .7s cubic-bezier(.4,.6,.2,1) both}
@keyframes warpOn{0%,75%{opacity:1}100%{opacity:0}}
@keyframes warpScan{from{transform:translateY(0)}to{transform:translateY(100vh)}}
@media (prefers-reduced-motion:reduce){.view.enter>*,#warp,.core .r,.core .pulse{animation:none!important}}

/* ---------- light mode details ---------- */
:root[data-mode="light"] .top{background:color-mix(in srgb,#fff 94%,transparent)}
:root[data-mode="light"] .tog::after{background:#fff;box-shadow:0 1px 3px rgba(16,22,34,.25)}
:root[data-mode="light"] .tog:not([aria-checked="true"]){background:#d5d9e0}
:root[data-mode="light"] .logo svg{filter:none}
:root[data-mode="light"] .core svg{filter:none}

/* ================= YOUTUBE-LIKE HOME ================= */
.ytchips{position:sticky;top:calc(var(--sat) + 60px);z-index:40;margin:0 calc(-1*max(16px,env(safe-area-inset-right,0px))) 0;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
@media (min-width:901px){.ytchips{top:0;margin:0;padding:16px 0 12px}}
.chip.ghostc{border-style:dashed}
.ytgrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:28px 16px;margin-top:10px}

.pv.mini.mus .pv-t small::before{content:"";width:12px;height:10px;flex:none;background:linear-gradient(var(--accent),var(--accent)) 0 100%/2px 60% no-repeat,linear-gradient(var(--accent),var(--accent)) 5px 100%/2px 100% no-repeat,linear-gradient(var(--accent),var(--accent)) 10px 100%/2px 40% no-repeat}
@media (max-width:900px){.pv.mini .pv-frame{width:118px!important}}

/* ---------- music ---------- */
.mhead{position:relative;margin-top:14px;border-radius:26px;overflow:hidden;padding:clamp(20px,4vw,40px);display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;isolation:isolate;border:1px solid var(--glass-b);
  background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--acc2) 55%,transparent),transparent 55%),radial-gradient(100% 120% at 0% 100%,rgba(var(--acc-rgb),.45),transparent 60%),#17111a}
.mhead .mt{display:flex;flex-direction:column;gap:6px;min-width:0}
.mhead .mt small{font-family:var(--f-tech);font-size:10px;letter-spacing:.3em;color:rgba(255,255,255,.75);direction:ltr;text-align:end}
.mhead h1{margin:0;font-size:clamp(30px,5vw,52px);font-weight:900;color:#fff;line-height:1.1}
.mhead p{margin:0;color:rgba(255,255,255,.8);font-size:13.5px}
.mhead .ma{display:flex;gap:10px;flex-wrap:wrap}
.mhead .ma .btn{height:46px;border-radius:999px;padding:0 20px}
.mhead .ma .btn.pri{background:#fff;color:#111;border:0;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.mhead .ma .btn.pri svg{color:var(--accent)}
.mhead .ma .btn:not(.pri){background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)}
.mhead .bars{position:absolute;inset-inline-end:-10px;bottom:-6px;z-index:-1;display:flex;gap:6px;align-items:flex-end;height:70%;max-width:50%;overflow:hidden;opacity:.2}
.mhead .bars i{width:10px;border-radius:6px 6px 0 0;background:#fff;height:30%;animation:eqb 1.4s ease-in-out infinite alternate}
.eqb i:nth-child(odd){animation-duration:1.1s}.eqb i:nth-child(3n){animation-duration:1.7s}.eqb i:nth-child(4n){animation-delay:-.6s}
@keyframes eqb{0%{height:15%}50%{height:90%}100%{height:40%}}
.tracks{margin-top:18px;display:flex;flex-direction:column;gap:6px}
.trk{display:grid;grid-template-columns:28px 54px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:8px 10px;border-radius:16px;border:1px solid transparent;background:transparent;color:var(--fg);text-align:start;width:100%;transition:background .2s,border-color .2s}
.trk:hover{background:var(--glass);border-color:var(--glass-b)}
.trk.now{background:linear-gradient(90deg,transparent,rgba(var(--acc-rgb),.16));border-color:rgba(var(--acc-rgb),.35)}
.trk .n{font-family:var(--f-hud);font-size:13px;color:var(--mute);text-align:center}
.trk .cv{width:54px;height:54px;border-radius:12px;overflow:hidden;position:relative;background:#000}
.trk .cv img,.trk .cv .sig{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.trk .tx{min-width:0}
.trk .tx b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .tx small{display:block;font-size:12px;color:var(--dim)}
.trk .d{font-family:var(--f-hud);font-size:12px;color:var(--dim)}
.trk .dots{width:34px;height:34px;border-radius:50%;border:0;background:none;color:var(--dim);display:grid;place-items:center}
.trk .dots svg{width:16px;height:16px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;height:40%;background:var(--accent);border-radius:2px;animation:eqb .9s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
body:not(.is-playing) .eq i{animation-play-state:paused}

/* music player deck */
.deck{position:relative;margin-top:14px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
.dk{position:relative;border-radius:30px;padding:clamp(16px,3vw,30px);overflow:hidden;isolation:isolate;border:1px solid var(--glass-b);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;gap:16px}
.dk .amb{position:absolute;inset:-30%;z-index:-1;filter:blur(60px) saturate(1.6);opacity:.55}
.dk .amb img,.dk .amb .sig{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dk .win{position:relative;width:min(100%,560px);border-radius:22px;padding:3px;background:conic-gradient(from var(--ang,0deg),var(--accent),var(--acc2),var(--acc3),var(--accent));animation:ring 6s linear infinite}
body:not(.is-playing) .dk .win{animation-play-state:paused}
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes ring{to{--ang:360deg}}
.dk .win .pslot{border-radius:19px!important;margin:0!important;overflow:hidden}
.dk .mi{width:100%;max-width:560px;text-align:center;display:flex;flex-direction:column;gap:4px}
.dk .mi small{font-family:var(--f-tech);font-size:9.5px;letter-spacing:.3em;color:var(--accent);direction:ltr}
.dk .mi h1{margin:0;font-size:clamp(20px,2.6vw,28px);font-weight:900;line-height:1.3;text-wrap:balance}
.dk .mi p{margin:0;color:var(--dim);font-size:13px}
.viz{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:34px;width:100%;max-width:560px}
.viz i{flex:1;max-width:6px;border-radius:3px;background:var(--grad);height:20%;animation:eqb 1.2s ease-in-out infinite alternate;opacity:.85}
body:not(.is-playing) .viz i{animation-play-state:paused;opacity:.35}
.mseek{width:100%;max-width:560px;display:flex;flex-direction:column;gap:4px}
.mseek .tr{position:relative;height:6px;border-radius:6px;background:var(--glass-hi)}
.mseek .tr i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--grad);box-shadow:0 0 14px rgba(var(--acc-rgb),.7)}
.mseek .tr input{position:absolute;inset:-10px 0;width:100%;opacity:0;cursor:pointer;margin:0}
.mseek .tm{display:flex;justify-content:space-between;font-family:var(--f-hud);font-size:12px;color:var(--dim);direction:ltr}
.mctl{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.4vw,18px);direction:ltr}
.mctl button{width:46px;height:46px;border-radius:50%;border:0;background:transparent;color:var(--fg);display:grid;place-items:center;transition:transform .15s,background .2s}
.mctl button:active{transform:scale(.9)}
.mctl button:hover{background:var(--glass-hi)}
.mctl button svg{width:22px;height:22px}
.mctl button.big{width:70px;height:70px;background:var(--grad);color:#fff;box-shadow:0 0 0 8px rgba(var(--acc-rgb),.14),0 16px 34px -10px rgba(var(--acc-rgb),.9)}
.mctl button.big svg{width:30px;height:30px}
.mctl button.tg{color:var(--mute)}
.mctl button.tg.on{color:var(--accent)}
.mctl .sk{position:relative}
.mctl .sk b{position:absolute;font:700 8px/1 var(--f-hud);top:50%;left:50%;transform:translate(-50%,-30%)}
.deck .wside{position:sticky}
@media (max-width:900px){
  .deck{grid-template-columns:minmax(0,1fr);gap:16px}
  .dk{border-radius:26px;margin-inline:0}
}

/* music page player override: the player follows the slot on phones too */
@media (max-width:900px){
  .pv.full.mus{position:absolute!important;right:auto!important;bottom:auto!important;border-radius:19px!important;box-shadow:none;z-index:20}
}
.pv.full.mus .pc-bar,.pv.full.mus .pc-big{display:none!important}

/* ---------- account box in settings ---------- */
.acct{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.acct .who{display:flex;align-items:center;gap:10px;font-size:13.5px}
.acct .who i{width:9px;height:9px;border-radius:50%;background:var(--mute);flex:none}
.acct .who.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.acct .rowb{display:flex;gap:8px;flex-wrap:wrap}
.acct .rowb .in{flex:1;min-width:150px}
.ro-note{margin-top:14px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-b);font-size:13px;color:var(--dim)}
.ro-note svg{width:16px;height:16px;color:var(--accent);flex:none}

/* ---------- light mode ---------- */
:root[data-mode="light"] .srcsw button.on{color:#fff}
:root[data-mode="light"] .dock .fab{border-color:#f3f4f7!important}
:root[data-mode="light"] .trk .cv{background:#ddd}
@media (prefers-reduced-motion:reduce){.spot .sbg img,.viz i,.eq i,.mhead .bars i,.dk .win{animation:none!important}}

@media (max-width:900px){.srcsw button svg{display:none}.top .srcsw button{padding:7px 12px}}
@media (max-width:480px){.mctl .sk{display:none}.mctl{gap:12px}.mctl button{width:44px;height:44px}.mctl button.big{width:64px;height:64px}}
.trk .tx b,.pv-t b,.qit .tx b{unicode-bidi:plaintext;text-align:right}

/* ===== hide YouTube's own overlays: the iframe is taller than the frame, so its title bar,
   logo and "more videos" strip sit in the cropped-off area; the video itself fills the frame ===== */
#pv .pv-frame{overflow:hidden}
#pv .pv-frame iframe{position:absolute;left:0;right:auto;top:-90px;bottom:auto;width:100%;height:calc(100% + 180px);border:0;pointer-events:none}
#pv .pv-frame iframe.raw,#pv.ad .pv-frame iframe{top:0;height:100%;pointer-events:auto}
.pv.ad .pctl{pointer-events:none}
.pv.ad .pc-bar,.pv.ad .pc-big,.pv.ad .pc-hit,.pv.ad .pc-load{display:none!important}
.pctl[data-st="end"]{background:#05060a}
.pc-ad{display:none;position:absolute;top:10px;left:10px;right:10px;margin:0 auto;width:max-content;max-width:calc(100% - 20px);z-index:7;pointer-events:auto;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(10,10,16,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font:600 12px/1.3 var(--f-ar);direction:rtl;text-align:center}
.pc-ad b{color:var(--accent);font-weight:800}
.pc-ad i{width:7px;height:7px;border-radius:50%;background:#ffb020;flex:none;animation:corePulse 1.4s infinite}
.pv.ad .pc-ad{display:inline-flex}
.pv.mini.ad .pctl{pointer-events:auto}.pv.mini.ad .pc-hit{display:block!important}.pv.mini.ad .pc-ad{display:none}
#pcTouch svg{width:20px;height:20px}
.dk .adn{display:none;width:100%;max-width:560px;padding:10px 14px;border-radius:14px;background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.35);color:var(--fg);font-size:13px;text-align:center}
body.ad-on .dk .adn{display:block}
body.ad-on .viz i,body.ad-on .dk .win{animation-play-state:paused!important}
@media (max-width:430px){.pc-row{gap:0}.pc-btn{width:33px!important}.pc-spd{min-width:44px!important;padding:0 6px!important}.pc-time{font-size:11px!important}}
@media (max-width:340px){#pcTouch{display:none}}

/* music plays as sound only: an artwork disc sits over the picture */
.pc-cover{display:none;position:absolute;inset:0;z-index:0;overflow:hidden;background:#0b0c10;pointer-events:none}
.pv.mus .pc-cover{display:grid;place-items:center}
.pv.ad .pc-cover{display:none!important}
.pc-cover .cvbg{position:absolute;inset:-20%;background:#120c14 var(--cv) center/cover;filter:blur(26px) saturate(1.5) brightness(.55)}
.pc-cover .disc{position:relative;height:78%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#0c0c10 0 2px,#17171d 2px 4px);box-shadow:0 0 0 2px rgba(255,255,255,.06),0 18px 40px rgba(0,0,0,.6),inset 0 0 30px rgba(0,0,0,.8);display:grid;place-items:center;animation:spin 7s linear infinite;animation-play-state:paused}
.pc-cover .disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent,rgba(255,255,255,.12) 8%,transparent 16%,transparent 50%,rgba(255,255,255,.08) 58%,transparent 66%)}
.pc-cover .disc span{width:44%;aspect-ratio:1;border-radius:50%;background:#222 var(--cv) center/cover;box-shadow:0 0 0 3px rgba(var(--acc-rgb),.85),0 0 22px rgba(var(--acc-rgb),.5);position:relative}
.pc-cover .disc span::after{content:"";position:absolute;inset:42%;border-radius:50%;background:#0b0c10;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
body.is-playing .pc-cover .disc{animation-play-state:running}
.pc-cover .cveq{position:absolute;bottom:10px;right:12px;display:flex;gap:3px;align-items:flex-end;height:18px}
.pc-cover .cveq i{width:3px;height:30%;border-radius:2px;background:var(--accent);animation:eqb .9s ease-in-out infinite alternate;animation-play-state:paused}
.pc-cover .cveq i:nth-child(2){animation-delay:-.3s}.pc-cover .cveq i:nth-child(3){animation-delay:-.6s}.pc-cover .cveq i:nth-child(4){animation-delay:-.15s}
body.is-playing .pc-cover .cveq i{animation-play-state:running}
.pv.mini.mus .pc-cover .disc{height:86%}.pv.mini.mus .pc-cover .cveq{display:none}
@media (prefers-reduced-motion:reduce){.pc-cover .disc,.pc-cover .cveq i{animation:none}}
[hidden]{display:none!important}

/* =====================================================================
   ALI VISION 4 — vivid & lively: deep indigo space, colour everywhere
   ===================================================================== */
:root{--bg:#090b15;--bg2:#0e1122;--card:#12152a;--card2:#191d36;--line:rgba(165,175,255,.08);--line2:rgba(165,175,255,.15);
  --fg:#eff1ff;--dim:#9ca2c4;--mute:#626890;--glass:rgba(17,20,40,.62);--glass-b:rgba(170,180,255,.11);--glass-hi:rgba(170,180,255,.16);
  --vi:#8b5cf6;--cy:#22d3ee;--ok:#34d399}
:root[data-mode="light"]{--bg:#f4f5fb;--bg2:#eceef8;--card:#ffffff;--card2:#f3f4fb;--line:rgba(30,36,90,.08);--line2:rgba(30,36,90,.14);
  --fg:#141735;--dim:#596086;--mute:#959bbd;--glass:rgba(255,255,255,.72);--glass-b:rgba(30,36,90,.09);--glass-hi:rgba(30,36,90,.14)}
body{background-color:var(--bg)!important;
  background-image:radial-gradient(760px 520px at 92% -12%,rgba(var(--acc-rgb),.24),transparent 62%),radial-gradient(640px 520px at -12% 28%,rgba(139,92,246,.17),transparent 62%),radial-gradient(760px 520px at 55% 112%,rgba(34,211,238,.11),transparent 62%),var(--bgpat,none)!important;
  background-size:auto,auto,auto,160px 160px!important;background-attachment:fixed!important}
:root[data-mode="light"] body{background-image:radial-gradient(760px 520px at 92% -12%,rgba(var(--acc-rgb),.14),transparent 62%),radial-gradient(640px 520px at -12% 28%,rgba(139,92,246,.10),transparent 62%),radial-gradient(760px 520px at 55% 112%,rgba(34,211,238,.10),transparent 62%),var(--bgpat,none)!important}
body::before{background:var(--bg)!important}

/* brand */
.brand b{background:linear-gradient(270deg,var(--fg) 38%,var(--accent) 62%,var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent!important}
@media (min-width:901px){.top .setb::after{content:"المظهر"!important}}
body:not(.adm) .top .cloud{display:none!important}

/* greeting */
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:16px 2px 4px}
.greet small{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--dim)}
.greet small i{width:8px;height:8px;border-radius:50%;background:var(--grad);box-shadow:0 0 12px rgba(var(--acc-rgb),.8)}
.greet h2{margin:2px 0 0;font-size:clamp(22px,3vw,30px);font-weight:900;letter-spacing:-.3px;line-height:1.2}
.greet h2 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* spotlight glows with the accent */
.spot{box-shadow:0 30px 60px -34px rgba(var(--acc-rgb),.75),0 0 0 1px var(--glass-b)!important;border:0!important}

/* colourful section tiles */
.tiles{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:12px;overflow-x:auto;scrollbar-width:none;padding:6px 2px 4px;margin-top:12px;overscroll-behavior-x:contain}
.tiles::-webkit-scrollbar{display:none}
.tl{position:relative;isolation:isolate;overflow:hidden;min-height:96px;border-radius:20px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);padding:12px 14px;text-align:start;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 92%,#fff 8%),color-mix(in srgb,var(--c) 55%,#1a1030));box-shadow:0 14px 30px -18px var(--c);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.tl:active{transform:scale(.96)}
.tl::before{content:"";position:absolute;z-index:-1;width:120px;height:120px;border-radius:50%;top:-50px;inset-inline-end:-40px;background:rgba(255,255,255,.18)}
.tl b{font-size:15.5px;font-weight:800;line-height:1.25;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.tl small{font-size:12px;opacity:.85}
.tl i{position:absolute;top:10px;inset-inline-end:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;backdrop-filter:blur(6px)}
.tl i svg{width:13px;height:13px;margin-left:2px}
.tl.on{outline:2px solid #fff;outline-offset:-2px}

/* cards pick up their section colour */
.vc{--c:var(--accent)}
.vc:hover .vt{box-shadow:0 0 0 1.5px var(--c),0 22px 44px -20px var(--c)!important}
.vt .bar i{background:linear-gradient(90deg,var(--c),var(--accent))!important}
.vav{background:color-mix(in srgb,var(--c) 22%,var(--card))!important;border-color:color-mix(in srgb,var(--c) 70%,transparent)!important;color:var(--c)!important}
.vi .tt{font-size:15.5px!important;line-height:1.45!important}
.sh h2{gap:12px}
.sh h2::before{content:"";width:5px;height:22px;border-radius:5px;background:var(--grad);box-shadow:0 0 12px rgba(var(--acc-rgb),.6)}
.chip{font-weight:700}
.chip .d{box-shadow:0 0 8px currentColor}

/* dock: soft colour pill on the active tab */
@media (max-width:900px){
  .dock a.on::after{display:none}
  .dock a.on::before{content:"";position:absolute;inset:7px 4px;border-radius:18px;background:rgba(var(--acc-rgb),.14);z-index:-1}
  .dock a,.dock button:not(.fab){isolation:isolate}
  .dock .fab{box-shadow:0 10px 26px -6px rgba(var(--acc-rgb),.9)!important}
}

/* buttons */
.btn.pri{background:var(--grad)!important;border:0!important;color:#fff!important}
.btn{transition:transform .15s,background .2s}
.btn:active{transform:scale(.96)}

/* ========== appearance drawer (what everyone sees) ========== */
.drawer.look .grp{display:flex;flex-direction:column;gap:12px}
.mdp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mdp button{border:1.5px solid var(--line2);background:var(--card2);color:var(--fg);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;font-weight:700;font-size:14px;align-items:stretch}
.mdp button.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.18)}
.mdp .pvw{height:64px;border-radius:10px;position:relative;overflow:hidden}
.mdp .pvw.dark{background:radial-gradient(80px 50px at 85% 0,rgba(var(--acc-rgb),.5),transparent),#0b0d18}
.mdp .pvw.light{background:radial-gradient(80px 50px at 85% 0,rgba(var(--acc-rgb),.3),transparent),#f4f5fb;border:1px solid rgba(30,36,90,.1)}
.mdp .pvw i{position:absolute;inset-inline:8px;height:8px;border-radius:4px;background:currentColor;opacity:.25}
.mdp .pvw.dark i{color:#fff}.mdp .pvw.light i{color:#141735}
.mdp .pvw i:nth-child(1){top:12px;width:50%}.mdp .pvw i:nth-child(2){top:28px;width:70%}.mdp .pvw i:nth-child(3){top:44px;width:35%;background:var(--accent);opacity:1}
.bgp{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.bgp button{border:1.5px solid var(--line2);background:var(--card2);color:var(--fg);border-radius:14px;padding:12px 8px;font-weight:700;font-size:13px}
.bgp button.on{border-color:var(--accent);background:rgba(var(--acc-rgb),.12)}
.look .sws .sw{width:42px;height:42px;border-radius:14px}

/* ========== MUSIC PLAYER: orbital, sci-fi and simple ========== */
.dk2{--fg:#eff1ff;--dim:#a6acd0;--mute:#6c7299;color:var(--fg);position:relative;isolation:isolate;overflow:hidden;border-radius:32px;padding:clamp(16px,3vw,28px);
  background:radial-gradient(420px 300px at 50% 18%,rgba(var(--acc-rgb),.30),transparent 70%),radial-gradient(400px 300px at 0% 100%,rgba(139,92,246,.22),transparent 70%),radial-gradient(400px 300px at 100% 100%,rgba(34,211,238,.14),transparent 70%),#0b0d1a;
  border:1px solid rgba(170,180,255,.12);box-shadow:0 30px 70px -40px rgba(var(--acc-rgb),.7);display:flex;flex-direction:column;align-items:center;gap:16px}

:focus-visible{outline:2px solid var(--accent)!important;outline-offset:3px;border-radius:10px}

    box-shadow:0 -14px 34px -18px rgba(0,0,0,.7)!important;overflow:visible}

.pc-load{animation-play-state:paused!important}
.pctl[data-st="buf"] .pc-load{animation-play-state:running!important}

.mhead .bars i{animation-duration:2.2s!important}

/* ===== v19: draggable seek bars ===== */
.mseek .tr{direction:ltr;touch-action:none;cursor:pointer;transition:height .15s}
.mseek .tr::before{content:"";position:absolute;left:-6px;right:-6px;top:-16px;bottom:-16px}
.mseek .tr input{pointer-events:none;direction:ltr}
.mseek .tr.drag{height:9px}
.mseek .kw{position:absolute;inset:0;pointer-events:none;transform:translateX(0)}
.mseek .kn{position:absolute;left:0;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(var(--acc-rgb),.45),0 2px 8px rgba(0,0,0,.5);transition:transform .15s}
.mseek .tr.drag .kn{transform:scale(1.35)}

.pc-seek{touch-action:none}
.pc-seek::after{content:"";position:absolute;left:0;right:0;top:-12px;bottom:-12px}
.pc-seek input{pointer-events:none}

function parseYT(raw){

  const l=/youtu/i.test(s)&&s.match(/[?&]list=([A-Za-z0-9_-]{10,})/);if(l)list=l[1];

function spotSet(f,anim){const tr=document.getElementById('strack');if(!tr)return;tr.classList.toggle('anim',!!anim);tr.style.transform=`translateX(${(f*100).toFixed(3)}%)`;
  tr.querySelectorAll('.sslide').forEach((x,k)=>x.style.setProperty('--o',(k-f).toFixed(3)))}
function spotGo(i){const sp=document.getElementById('spot');if(!sp||!spotL.length)return;spotI=(i+spotL.length)%spotL.length;spotSet(spotI,true);
  sp.querySelectorAll('.sslide').forEach((x,k)=>{const on=k===spotI;x.classList.toggle('on',on);x.setAttribute('aria-hidden',!on);x.querySelectorAll('button').forEach(b=>b.tabIndex=on?0:-1);
    if(Math.abs(k-spotI)<=1){const im=x.querySelector('img[loading="lazy"]');if(im)im.loading='eager'}});

/* finger / mouse drag that follows you, with momentum and a soft edge */
(()=>{let d=null;
  document.addEventListener('pointerdown',e=>{const sp=e.target.closest&&e.target.closest('#spot');if(!sp||spotL.length<2||(e.pointerType==='mouse'&&e.button!==0))return;const t=performance.now();d={x:e.clientX,y:e.clientY,w:sp.clientWidth,dx:0,on:false,id:e.pointerId,sp,vx:0,lx:e.clientX,lt:t}},{passive:true});
  document.addEventListener('pointermove',e=>{if(!d||e.pointerId!==d.id)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;
    if(!d.on){if(Math.abs(dx)>7&&Math.abs(dx)>Math.abs(dy)*1.1){d.on=true;d.sp.classList.add('drag');try{d.sp.setPointerCapture(d.id)}catch(_){}}else if(Math.abs(dy)>10){d=null;return}else return}
    const now=performance.now();d.vx=d.vx*.4+((e.clientX-d.lx)/Math.max(1,now-d.lt))*.6;d.lx=e.clientX;d.lt=now;d.dx=dx;
    let f=spotI+dx/d.w;const last=spotL.length-1;if(f<0)f*=.3;else if(f>last)f=last+(f-last)*.3;spotSet(f,false)},{passive:true});
  const up=e=>{if(!d||e.pointerId!==d.id)return;const q=d;d=null;if(!q.on)return;q.sp.classList.remove('drag');SPOTDRAG=Date.now();
    const r=q.dx/q.w;let to=spotI;if(r>.16||q.vx>.4)to++;else if(r<-.16||q.vx<-.4)to--;to=Math.max(0,Math.min(spotL.length-1,to));spotGo(to)};
  document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
})();

  let v0=target;try{v0=yt.getVolume()}catch(e){}const t0=performance.now();
  const f=()=>{const k=Math.min(1,(performance.now()-t0)/ms);try{yt.setVolume(Math.round(v0+(target-v0)*k))}catch(e){}if(k<1)setTimeout(f,30);else cb&&cb()};f()}

function openPalette(){
  openLayer(`<div class="panel pal" role="dialog" aria-modal="true" aria-label="بحث"><div class="pi">${I.search}<input id="pq" placeholder="دوّر بالعنوان، القسم، الملاحظات…" autofocus autocomplete="off"><span class="kbd">Esc</span></div><div class="pres" id="pres"></div></div>`);
  let sel=0,items=[];
  const cmds=[{t:'إضافة مقطع',ic:'plus',run:()=>openEditor()},{t:'المكتبة',ic:'grid',run:()=>go('library')},{t:'الموسيقى',ic:'music',run:()=>go('music')},{t:'إدارة الأقسام',ic:'folder',run:()=>openSections()},{t:'الإعدادات',ic:'gear',run:()=>openSettings()},
    {t:'تشغيل عشوائي',ic:'shuffle',run:()=>{const a=S.videos.map(v=>v.id).sort(()=>Math.random()-.5);if(a.length)playCtx(a[0],a,'تشغيل عشوائي')}}];
  const draw=()=>{
    const q=$('#pq').value.trim().toLowerCase();
    const vids=S.videos.filter(v=>!q||hit(v,q)).sort((a,b)=>(b.last||0)-(a.last||0)).slice(0,24).map(v=>({g:v.kind==='music'?'الموسيقى':'المقاطع',t:v.title,s:(secOf(v.section)?.name||'بدون قسم')+(v.dur?' · '+fmtT(v.dur):''),vid:v.vid,run:()=>goV(v.id,v.kind==='music'||((route==='music'||route.startsWith('m-'))&&isMusic(v))?'m':'w')}));
    const secs=S.sections.filter(s=>q&&s.name.toLowerCase().includes(q)).map(s=>({g:'الأقسام',t:s.name,s:S.videos.filter(v=>v.section===s.id).length+' مقطع',dot:s.color,run:()=>{libF=s.id;go('library')}}));
    const cs=cmds.filter(c=>!q||c.t.includes(q)).map(c=>({...c,g:'أوامر'}));
    items=[...secs,...vids,...cs];sel=Math.max(0,Math.min(sel,items.length-1));let g='';
    $('#pres').innerHTML=items.length?items.map((it,i)=>{const h=it.g!==g?`<div class="pgrp">${it.g}</div>`:'';g=it.g;return h+`<button class="pr ${i===sel?'sel':''}" data-i="${i}">${it.vid?`<span class="tn">${img(it.vid,'default',false)}</span>`:it.dot?`<span class="ic"><span style="width:10px;height:10px;border-radius:2px;transform:rotate(45deg);background:${it.dot}"></span></span>`:`<span class="ic">${I[it.ic]}</span>`}<span class="pt">${esc(it.t)}${it.s?`<div class="ps">${esc(it.s)}</div>`:''}</span></button>`}).join(''):'<div class="muted" style="padding:20px;text-align:center">ماكو نتائج</div>';
    const s=$('#pres .sel');if(s)s.scrollIntoView({block:'nearest'});
  };
  const run=i=>{const it=items[i];if(!it)return;closeLayer(true);it.run()};
  $('#pq').oninput=()=>{sel=0;draw()};
  $('#pq').onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(sel+1,items.length-1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);draw();e.preventDefault()}else if(e.key==='Enter'){e.preventDefault();run(sel)}};
  $('#pres').onclick=e=>{const b=e.target.closest('[data-i]');if(b)run(+b.dataset.i)};
  draw();
}

const PRESETS=[['#e3172b','أحمر'],['#ff4d1a','برتقالي'],['#ffc400','ذهبي'],['#2fd27a','أخضر'],['#00c2ff','سماوي'],['#3d6bff','أزرق'],['#8b5cff','بنفسجي'],['#ff2bd6','وردي']];
async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('alivision:'+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of t)h=(h*33+c.charCodeAt(0))|0;return 'w'+h}}
