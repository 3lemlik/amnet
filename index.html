/* ================= cloud (Firebase): public library for everyone + personal library per account ================= */
const PF=['fav','watched','pos','plays','last','marks'];
const AUTH={admin:false,user:null,A:null,U:null};
const cloud={state:'',msg:'دا يتصل بقاعدة البيانات…',pubRef:null,mineRef:null,pubRev:null,mineRev:null,tp:null,tm:null,mineUnsub:null,mineFirst:true};
function shared(){const st=S.settings;return{sections:S.sections,videos:S.videos,brand:{name:st.name,accent:st.accent,mode:st.mode,bg:st.bg,corners:st.corners}}}
function applyShared(d){S.sections=d.sections||[];S.videos=(d.videos||[]).map(v=>({marks:[],pos:0,dur:0,plays:0,...v}));fixLib(LIB());if(d.brand)Object.assign(S.settings,d.brand)}
function setCloud(state,msg){const was=cloud.state;if(was===''&&state&&S.src==='pub'&&route==='home'&&document.querySelector('.skel'))setTimeout(()=>rerender(true),0);cloud.state=state;cloud.msg=msg;const d=$('#cloudDot');if(d){d.className='cloud '+state;$('#cloudTxt').textContent=state==='on'?'متصل':state==='err'?'خطأ بالاتصال':'محلي';d.title=msg}const cs=$('#cStat');if(cs){cs.className='status '+state;$('#cMsg').textContent=msg}}
const loadScript=src=>new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.append(s)});
function keepCur(L){if(!cur)return;const i=L.videos.findIndex(x=>x.id===cur.id);if(i<0)return;const n=L.videos[i];const pos=Math.max(n.pos||0,cur.pos||0);Object.assign(cur,n,{pos});L.videos[i]=cur}
function stripV(v){const o={};['id','vid','title','section','note','start','added','dur','ex','kind','list','imp'].forEach(k=>{if(v[k]!==undefined)o[k]=v[k]});return o}
function applyPub(d){const old=new Map(S.pub.videos.map(v=>[v.id,v]));S.pub.sections=d.sections||[];
  S.pub.videos=(d.videos||[]).map(v=>{const o=old.get(v.id)||{};const r={marks:[],pos:0,plays:0,fav:false,watched:false,last:0,...v};PF.forEach(k=>{if(o[k]!==undefined)r[k]=o[k]});r.dur=Math.max(v.dur||0,o.dur||0);return r});
  fixLib(S.pub);keepCur(S.pub)}
function applyMine(d){S.mine.sections=d.sections||[];S.mine.videos=(d.videos||[]).map(v=>({marks:[],pos:0,dur:0,plays:0,...v}));fixLib(S.mine);keepCur(S.mine)}
async function fbLoad(){if(window.firebase&&firebase.auth&&firebase.firestore)return;const B='https://www.gstatic.com/firebasejs/10.12.2/';await loadScript(B+'firebase-app-compat.js');await loadScript(B+'firebase-auth-compat.js');await loadScript(B+'firebase-firestore-compat.js')}
function refreshSettings(){if(document.querySelector('#layer .drawer')&&!document.activeElement?.matches?.('#layer input'))openSettings()}
async function cloudInit(){
  if(!ONLINE){setCloud('err','قاعدة البيانات تشتغل على رابط الموقع المنشور فقط');return}
  setCloud('','دا يتصل بقاعدة البيانات…');
  try{await fbLoad()}catch(e){setCloud('err','ما گدرت أتصل بقاعدة البيانات، تأكد من الإنترنت');return}
  const mk=n=>firebase.apps.find(a=>a.name===n)||firebase.initializeApp(FB_CFG,n);
  AUTH.A=mk('av-admin');AUTH.U=mk('av-user');
  cloud.pubRef=AUTH.A.firestore().collection('alivision').doc('public');
  cloud.pubRef.onSnapshot(snap=>{
    if(!snap.exists){setCloud('on','متصل · المحتوى العام فارغ لحد الآن');return}
    const d=snap.data();
    if(d.rev&&d.rev===cloud.pubRev){setCloud('on','متصل · انحفظ للكل');return}
    try{applyPub(JSON.parse(d.payload));saveLocal();if(S.src==='pub')rerender(true)}catch(e){}
    setCloud('on','متصل · المحتوى العام يوصل لكل الأجهزة');
  },err=>setCloud('err',err.code==='permission-denied'?'قاعدة البيانات رفضت الوصول، لازم تنشر قواعد Firestore الجديدة':'انقطع الاتصال بقاعدة البيانات'));
  AUTH.A.auth().onAuthStateChanged(u=>{AUTH.admin=!!u&&(u.email||'').toLowerCase()===ADMIN_EMAIL;syncFab();rerender(true);refreshSettings()});
  AUTH.U.auth().onAuthStateChanged(u=>{AUTH.user=u||null;mineSub();refreshSettings()});
}
function mineSub(){
  try{cloud.mineUnsub&&cloud.mineUnsub()}catch(e){}cloud.mineUnsub=null;cloud.mineRef=null;
  if(!AUTH.user)return;
  cloud.mineRef=AUTH.U.firestore().collection('alivision_users').doc(AUTH.user.uid);cloud.mineFirst=true;
  cloud.mineUnsub=cloud.mineRef.onSnapshot(snap=>{
    const first=cloud.mineFirst;cloud.mineFirst=false;
    if(!snap.exists){if(first)pushMine(true);return}
    const d=snap.data();if(d.rev&&d.rev===cloud.mineRev)return;
    try{const remote=JSON.parse(d.payload);
      if(first){const have=new Set((remote.videos||[]).map(v=>v.vid));const extra=S.mine.videos.filter(v=>!have.has(v.vid)&&!v.ex);
        const hs=new Set((remote.sections||[]).map(x=>x.id));const exs=S.mine.sections.filter(x=>!hs.has(x.id)&&!x.music&&extra.some(v=>v.section===x.id));
        applyMine(remote);if(extra.length){S.mine.sections.push(...exs);S.mine.videos.push(...extra);pushMine(true)}}
      else applyMine(remote);
      saveLocal();if(S.src==='mine')rerender(true)}catch(e){}
  },()=>toast('ما گدرت أوصل لمكتبتك الشخصية'));
}
function pushPub(now){if(!cloud.pubRef||!AUTH.admin)return;clearTimeout(cloud.tp);cloud.tp=setTimeout(()=>{cloud.pubRev=uid();cloud.pubRef.set({payload:JSON.stringify({sections:S.pub.sections,videos:S.pub.videos.map(stripV)}),rev:cloud.pubRev,updated:Date.now()}).catch(err=>setCloud('err',err.code==='permission-denied'?'قاعدة البيانات رفضت الحفظ، انشر القواعد الجديدة':'فشل الحفظ'))},now?0:1200)}
function pushMine(now){if(!cloud.mineRef)return;clearTimeout(cloud.tm);cloud.tm=setTimeout(()=>{cloud.mineRev=uid();cloud.mineRef.set({payload:JSON.stringify({sections:S.mine.sections,videos:S.mine.videos}),rev:cloud.mineRev,updated:Date.now()}).catch(()=>toast('ما انحفظت مكتبتك على الحساب'))},now?0:1500)}
function cloudPush(now){if(S.src==='pub')pushPub(now);else pushMine(now)}
async function userLogin(code){
  code=(code||'').trim();if(code.length<6){toast('الرمز لازم 6 أحرف أو أكثر');return}
  if(!AUTH.U){toast('قاعدة البيانات مو متصلة');return}
  const email='u'+(await sha('user:'+code)).slice(0,30)+'@alivision.app',a=AUTH.U.auth();
  try{await a.signInWithEmailAndPassword(email,code)}catch(e){const c=(e&&e.code)||'';
    if(/user-not-found|invalid-credential|invalid-login-credentials|wrong-password/.test(c)){try{await a.createUserWithEmailAndPassword(email,code)}catch(x){toast(x.code==='auth/operation-not-allowed'?'الدخول بالإيميل مطفي بـ Firebase':'ما گدرت أدخل، جرب رمز ثاني');return}}
    else{toast(c==='auth/network-request-failed'?'ماكو إنترنت':'ما گدرت أدخل');return}}
  setSrc('mine',true);rerender();toast('هلا بيك، مكتبتك الشخصية صارت متزامنة');
}
async function adminLogin(pw){
  if(!pw)return;if(!AUTH.A){toast('قاعدة البيانات مو متصلة');return}
  try{await AUTH.A.auth().signInWithEmailAndPassword(ADMIN_EMAIL,pw);toast('هلا علي، تگدر تعدّل المحتوى العام')}catch(e){toast(e&&e.code==='auth/network-request-failed'?'ماكو إنترنت':'الباسورد غلط')}
}

const lsG=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

   <div class="pb">${u?`<div class="who"><i></i>مكتبتك متزامنة على كل أجهزتك</div><p>بأي جهاز ثاني اكتب نفس رمزك وتطلعلك نفس المقاطع.</p>`:`<p>مقاطعك الشخصية محفوظة على هذا الجهاز. إذا تريدها تطلع بكل أجهزتك، اختار رمز سري إلك (6 أحرف أو أكثر)، وبأي جهاز تكتبه تطلعلك نفس مكتبتك.</p><input class="in" id="pCode" type="password" placeholder="رمزك السري" autocomplete="off">`}</div>

/* swipe: full player down => shrinks to mini and opens home · mini down => close · mini up => open */
(()=>{let sw=null;const pv=$('#pv');
  pv.addEventListener('touchstart',e=>{if(document.body.classList.contains('pv-fs')||document.fullscreenElement)return;const tg=e.target;
    if(PV.mode==='full'&&!tg.closest('#pcHit,.pv-hint'))return;if(PV.mode==='mini'&&tg.closest('button:not(#pvOpen),input'))return;
    const t=e.touches[0];sw={x:t.clientX,y:t.clientY,dy:0,on:false,mode:PV.mode}},{passive:true});
  pv.addEventListener('touchmove',e=>{if(!sw)return;const t=e.touches[0],dy=t.clientY-sw.y,dx=t.clientX-sw.x;
    if(!sw.on){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)*1.2&&(dy>0||sw.mode==='mini'))sw.on=true;else if(Math.abs(dx)>14||(dy<-10&&sw.mode==='full')){sw=null;return}else return}
    e.preventDefault();sw.dy=sw.mode==='full'?Math.max(0,dy):dy;pv.classList.add('dragging');
    if(sw.mode==='full'){const k=Math.min(1,sw.dy/320);pv.style.transform=`translateY(${sw.dy}px) scale(${1-k*.35})`;pv.style.transformOrigin='50% 0';pv.style.opacity=String(1-k*.35)}
    else{pv.style.transform=`translateY(${Math.max(-60,sw.dy)}px)`;pv.style.opacity=String(1-Math.max(0,sw.dy)/160)}},{passive:false});
  const end=()=>{if(!sw)return;const s2=sw;sw=null;if(!s2.on)return;PC.swiped=Date.now();pv.classList.remove('dragging');pv.classList.add('snap');buzz(10);

});

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('[data-seek]')){e.target.click();return}

  if(e.key==='?'){e.preventDefault();openLayer(`<div class="panel" role="dialog" aria-modal="true"><div class="ph"><h4>اختصارات الكيبورد</h4><button class="xb" data-close aria-label="سدّها">${I.x}</button></div><div class="pb keys">${[['Ctrl K أو /','بحث'],['N','إضافة مقطع'],['مسافة أو K','تشغيل وإيقاف'],['← →','10 ثواني قدّام ورا'],['N / P بصفحة المقطع','التالي والسابق'],['C','وضع السينما'],['Esc','سد النوافذ']].map(([a,b])=>`<div><kbd>${a}</kbd><span>${b}</span></div>`).join('')}</div></div>`);return}

    else if(k==='n')step(1);else if(k==='p')step(-1);else if(k==='c')$('#tCine')?.click();
  }
});

/* ================= background canvas ================= */
const cv=$('#fx'),cx=cv.getContext('2d');let W,H,parts=[],tick=0,raf;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function bgReset(){
  if(S.settings.bg!=='grid'&&S.settings.bg!=='stars'){cv.width=cv.height=0;cv.style.display='none';cancelAnimationFrame(raf);return}cv.style.display='';
  const dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  parts=[];if(S.settings.bg==='stars')for(let i=0;i<150;i++)parts.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()+.2});
  cancelAnimationFrame(raf);frame();
}
function frame(){
  const st=S.settings,acc=st.accent,g=st.glow/100;cx.clearRect(0,0,W,H);tick++;
  if(st.bg==='grid'){const hz=H*.6;cx.strokeStyle=acc;cx.lineWidth=1;
    for(let i=0;i<16;i++){const p=(i+(tick*.01)%1)/16,y=hz+Math.pow(p,2.2)*(H-hz);cx.globalAlpha=p*.3*g+.02;cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}
    for(let i=-18;i<=18;i++){cx.globalAlpha=.1*g+.02;cx.beginPath();cx.moveTo(W/2+i*20,hz);cx.lineTo(W/2+i*W*.15,H);cx.stroke()}}
  else if(st.bg==='stars'){cx.fillStyle=root.dataset.mode==='light'?'#334':'#fff';parts.forEach(p=>{p.x-=p.z*.35;if(p.x<0)p.x=W;cx.globalAlpha=p.z*.6;cx.fillRect(p.x,p.y,p.z*1.6,p.z*1.6)});cx.fillStyle=acc;cx.globalAlpha=.7*g;parts.slice(0,14).forEach(p=>cx.fillRect(p.x,p.y,2.4,2.4))}
  cx.globalAlpha=1;
  if(st.motion&&!RM&&(st.bg==='grid'||st.bg==='stars'))raf=requestAnimationFrame(frame);
}
addEventListener('resize',()=>{clearTimeout(bgReset.t);bgReset.t=setTimeout(bgReset,150)});

if(matchMedia('(pointer:fine)').matches&&!RM){
  document.addEventListener('pointermove',e=>{if(!S.settings.motion)return;const t=e.target.closest&&e.target.closest('.vt');
    if(t){const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.setProperty('--rx',(-y*7).toFixed(2)+'deg');t.style.setProperty('--ry',(x*9).toFixed(2)+'deg')}
    const sp=e.target.closest&&e.target.closest('#spot');if(sp){const r=sp.getBoundingClientRect();sp.style.setProperty('--px',((e.clientX-r.left)/r.width-.5).toFixed(3));sp.style.setProperty('--py',((e.clientY-r.top)/r.height-.5).toFixed(3))}},{passive:true});
  document.addEventListener('pointerout',e=>{const t=e.target.closest&&e.target.closest('.vt');if(t&&!t.contains(e.relatedTarget)){t.style.removeProperty('--rx');t.style.removeProperty('--ry')}},{passive:true});
}
try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(S.settings.mode==='auto'){apply();rerender(true)}})}catch(e){}
window.__av={playing:()=>{try{return!!yt&&yt.getPlayerState()===1}catch(e){return false}},toast};
})();

<script>
/* تحديث تلقائي: يفحص النسخة كل دقيقة ومن ترجع للتطبيق */
(function(){
  if(!/^https?:/.test(location.protocol))return;
  try{const u=new URL(location.href);if(u.searchParams.has('_v')){u.searchParams.delete('_v');history.replaceState(null,'',u.pathname+u.search+u.hash)}}catch(e){}
  const mine=(document.querySelector('meta[name="app-build"]')||{}).content||'';
  let pending=null,busy=false;
  function playing(){try{return!!(window.__av&&window.__av.playing())}catch(e){return false}}
  function reload(v){
    if(playing()&&!document.hidden){pending=v;return}
    try{window.__av&&window.__av.toast('جاي نحدّث الموقع للنسخة الجديدة…')}catch(e){}
    setTimeout(()=>{location.replace(location.pathname+'?_v='+encodeURIComponent(v)+location.hash)},600);
  }
  async function check(){
    if(busy)return;busy=true;
    try{
      const r=await fetch(location.pathname+'?_c='+Date.now(),{cache:'no-store',headers:{Range:'bytes=0-4095'}});
      if(r.ok){let t='';try{const rd=r.body.getReader();const {value}=await rd.read();t=new TextDecoder().decode(value||new Uint8Array());rd.cancel().catch(()=>{})}catch(_){t=await r.text()}const m=t.match(/name="app-build" content="([^"]+)"/);
        if(m&&mine&&m[1]!==mine)reload(m[1]);}
    }catch(e){}busy=false;
  }
  setInterval(()=>{if(pending&&!playing())reload(pending);else check()},300000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(pending&&!playing())reload(pending);else check()}});
  window.addEventListener('pageshow',e=>{if(e.persisted)check()});
  window.addEventListener('focus',check);
  setTimeout(check,4000);
})();
</script>
